<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaizenBot - Dashboard de Propuestas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #EEEDFE; min-height: 100vh; color: #1a1a2e; }

  /* PANTALLA DE ACCESO */
  #access-screen { position: fixed; inset: 0; background: #EEEDFE; display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  #access-box { background: #fff; border-radius: 20px; padding: 40px 32px; width: 100%; max-width: 400px; box-shadow: 0 8px 40px rgba(83,74,183,0.15); text-align: center; }
  #access-box .logo { font-size: 40px; margin-bottom: 16px; }
  #access-box h1 { font-size: 24px; font-weight: 700; color: #534AB7; margin-bottom: 8px; }
  #access-box p { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.6; }
  #access-input { width: 100%; padding: 12px 16px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 16px; font-family: inherit; outline: none; text-align: center; letter-spacing: 2px; text-transform: uppercase; transition: border-color 0.2s; margin-bottom: 12px; }
  #access-input:focus { border-color: #534AB7; }
  #access-btn { width: 100%; padding: 12px; background: #534AB7; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s; }
  #access-btn:hover { background: #3C3489; }
  #access-error { color: #E24B4A; font-size: 13px; margin-top: 8px; min-height: 20px; }

  /* DASHBOARD */
  #dashboard { display: none; max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  #dash-header { background: #534AB7; border-radius: 16px; padding: 20px 24px; display: flex; align-items: center; gap: 14px; margin-bottom: 24px; box-shadow: 0 8px 30px rgba(83,74,183,0.2); }
  #dash-header .avatar { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  #dash-header .titles h1 { font-size: 18px; font-weight: 700; color: #fff; }
  #dash-header .titles p { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }

  #toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  #toolbar select { padding: 9px 14px; border-radius: 20px; border: 1.5px solid #534AB7; color: #534AB7; background: #fff; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; }
  #toolbar .count { margin-left: auto; font-size: 12px; color: #666; }
  #toolbar .count b { color: #534AB7; }

  #table-wrap { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(83,74,183,0.08); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 12px 14px; background: #f7f8fc; color: #534AB7; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1.5px solid #EEEDFE; white-space: nowrap; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid #f2f2f8; color: #1a1a2e; }
  tbody tr:hover { background: #f7f8fc; }
  tbody tr:last-child td { border-bottom: none; }
  .id-cell { font-weight: 700; color: #534AB7; white-space: nowrap; }

  .badge { display: inline-block; padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.borrador { background: #eee; color: #666; }
  .badge.enviada { background: #E3F0FF; color: #2563AC; }
  .badge.revision { background: #FFF3D6; color: #A67200; }
  .badge.aprobada { background: #E3F7E8; color: #1E8E4A; }
  .badge.rechazada { background: #FDE7E7; color: #C0392B; }
  .badge.implementada { background: #EAE3FF; color: #6A3FC7; }
  .badge.identificada { background: #F0F0F0; color: #555; }

  #empty-state { text-align: center; padding: 60px 20px; color: #888; }
  #empty-state .ico { font-size: 36px; margin-bottom: 10px; }

  @media (max-width: 640px) {
    #table-wrap { overflow-x: auto; }
    table { min-width: 640px; }
  }
</style>
</head>
<body>

<div id="access-screen">
  <div id="access-box">
    <div class="logo">📊</div>
    <h1>Dashboard KaizenBot</h1>
    <p>Acceso para supervisores<br>ProKaizen Consulting</p>
    <input type="text" id="access-input" placeholder="CÓDIGO DE ACCESO" maxlength="20" />
    <button id="access-btn" onclick="checkAccess()">Ingresar</button>
    <div id="access-error"></div>
  </div>
</div>

<div id="dashboard">
  <div id="dash-header">
    <div class="avatar">📊</div>
    <div class="titles">
      <h1>Dashboard de Propuestas</h1>
      <p>KaizenBot · ProKaizen Consulting</p>
    </div>
  </div>

  <div id="toolbar">
    <select id="filtro-estado" onchange="renderTabla()">
      <option value="">Todos los estados</option>
    </select>
    <select id="filtro-area" onchange="renderTabla()">
      <option value="">Todas las áreas</option>
    </select>
    <div class="count"><b id="count-num">0</b> propuestas</div>
  </div>

  <div id="table-wrap">
    <table id="tabla-propuestas" style="display:none;">
      <thead>
        <tr>
          <th>ID</th>
          <th>Colaborador</th>
          <th>Área</th>
          <th>Proceso</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Indicador</th>
        </tr>
      </thead>
      <tbody id="tabla-body"></tbody>
    </table>
    <div id="empty-state">
      <div class="ico">📭</div>
      <div id="empty-text">Cargando propuestas...</div>
    </div>
  </div>
</div>

<script>
const SUPERVISOR_CODES = ["SUPERVISOR01"];
let todasLasPropuestas = [];

function checkAccess() {
  const code = document.getElementById('access-input').value.trim().toUpperCase();
  const errorDiv = document.getElementById('access-error');
  if (SUPERVISOR_CODES.includes(code)) {
    document.getElementById('access-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    cargarPropuestas();
  } else {
    errorDiv.textContent = 'Código incorrecto. Por favor verifica e intenta de nuevo.';
    document.getElementById('access-input').value = '';
    document.getElementById('access-input').focus();
  }
}

document.getElementById('access-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkAccess();
});

async function cargarPropuestas() {
  const emptyText = document.getElementById('empty-text');
  try {
    const response = await fetch('/api/get-dashboard-proposals');
    if (!response.ok) {
      emptyText.textContent = 'No se pudieron cargar las propuestas. Intenta recargar la página.';
      return;
    }
    const data = await response.json();
    todasLasPropuestas = data.propuestas || [];
    poblarFiltros();
    renderTabla();
  } catch (e) {
    emptyText.textContent = 'No se pudieron cargar las propuestas. Intenta recargar la página.';
  }
}

function poblarFiltros() {
  const estados = [...new Set(todasLasPropuestas.map(p => p.estado).filter(Boolean))].sort();
  const areas = [...new Set(todasLasPropuestas.map(p => p.area).filter(Boolean))].sort();

  const selEstado = document.getElementById('filtro-estado');
  estados.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e; opt.textContent = e;
    selEstado.appendChild(opt);
  });

  const selArea = document.getElementById('filtro-area');
  areas.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    selArea.appendChild(opt);
  });
}

function badgeClass(estado) {
  const map = {
    'Borrador': 'borrador', 'Enviada': 'enviada', 'En revisión': 'revision',
    'Aprobada': 'aprobada', 'Rechazada': 'rechazada', 'Implementada': 'implementada',
    'Identificada': 'identificada'
  };
  return map[estado] || 'borrador';
}

function renderTabla() {
  const estadoSel = document.getElementById('filtro-estado').value;
  const areaSel = document.getElementById('filtro-area').value;

  const filtradas = todasLasPropuestas.filter(p =>
    (!estadoSel || p.estado === estadoSel) &&
    (!areaSel || p.area === areaSel)
  );

  const tabla = document.getElementById('tabla-propuestas');
  const tbody = document.getElementById('tabla-body');
  const emptyState = document.getElementById('empty-state');
  const emptyText = document.getElementById('empty-text');

  document.getElementById('count-num').textContent = filtradas.length;

  if (filtradas.length === 0) {
    tabla.style.display = 'none';
    emptyState.style.display = 'block';
    emptyText.textContent = todasLasPropuestas.length === 0
      ? 'Todavía no hay propuestas registradas.'
      : 'Ninguna propuesta coincide con estos filtros.';
    return;
  }

  tabla.style.display = 'table';
  emptyState.style.display = 'none';
  tbody.innerHTML = filtradas.map(p => `
    <tr>
      <td class="id-cell">${p.id_propuesta || ''}</td>
      <td>${p.colaborador || ''}</td>
      <td>${p.area || ''}</td>
      <td>${p.proceso || ''}</td>
      <td>${p.fecha || ''}</td>
      <td><span class="badge ${badgeClass(p.estado)}">${p.estado || ''}</span></td>
      <td>${p.indicador || ''}</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
