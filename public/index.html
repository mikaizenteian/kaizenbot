<script>

const ACCESS_CODES = [
  "KAIZEN01","KAIZEN02","KAIZEN03","KAIZEN04","KAIZEN05","PROKAIZEN","ORLANDO2025"
];

let history = [];
let waiting = false;
let proposalData = {};
let proposalReady = false;
let currentProposalId = null;

const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const phaseBadge = document.getElementById('phase-badge');
const btnSave = document.getElementById('btn-save');
const btnDownload = document.getElementById('btn-download');

function checkAccess() {
  const code = document.getElementById('access-input').value.trim().toUpperCase();
  const errorDiv = document.getElementById('access-error');
  if (ACCESS_CODES.includes(code)) {
    document.getElementById('access-screen').style.display = 'none';
    document.getElementById('employee-screen').classList.add('active');
    document.getElementById('employee-input').focus();
  } else {
    errorDiv.textContent = 'Código incorrecto. Por favor verifica e intenta de nuevo.';
    document.getElementById('access-input').value = '';
    document.getElementById('access-input').focus();
  }
}

async function checkEmployee() {
  const num = document.getElementById('employee-input').value.trim().toUpperCase();
  const errorDiv = document.getElementById('employee-error');
  const dataDiv = document.getElementById('employee-data');
  const confirmBtn = document.getElementById('employee-confirm');

  if (!num) {
    errorDiv.textContent = 'Por favor ingresa tu número de empleado.';
    return;
  }

  errorDiv.textContent = '';
  document.getElementById('employee-btn').textContent = 'Buscando...';
  document.getElementById('employee-btn').disabled = true;

  const colab = await getCollaborator(num);

  document.getElementById('employee-btn').textContent = 'Buscar';
  document.getElementById('employee-btn').disabled = false;

  if (!colab || !colab.nombre) {
    errorDiv.textContent = 'No encontré ese número de empleado. Por favor verifica e intenta de nuevo.';
    dataDiv.style.display = 'none';
    confirmBtn.style.display = 'none';
    return;
  }

  document.getElementById('emp-nombre').textContent = '👤 ' + colab.nombre;
  document.getElementById('emp-area').textContent = '🏢 ' + colab.area;
  document.getElementById('emp-email').textContent = '📧 ' + colab.email_colaborador;
  dataDiv.style.display = 'block';
  confirmBtn.style.display = 'block';

  proposalData.COLABORADOR = colab.nombre;
  proposalData.AREA = colab.area;
  proposalData.EMAIL_COLABORADOR = colab.email_colaborador;
  proposalData.EMAIL_SUPERVISOR = colab.email_supervisor;
}

function confirmEmployee() {
  document.getElementById('employee-screen').classList.remove('active');
  init();
}

document.getElementById('access-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAccess();
});

function generateProposalId() {
  const year = new Date().getFullYear();
  const seq = String(Math.floor(Math.random() * 9000) + 1000);
  return `KT-${year}-${seq}`;
}

function getCurrentDate() {
  return new Date().toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function getCollaborator(numeroEmpleado) {
  try {
    const response = await fetch('/api/get-collaborator', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ numero_empleado: numeroEmpleado })
    });
    if (!response.ok) return null;
    const data = await response.json();
    return data;
  } catch (e) {
    return null;
  }
}

async function getIndicadores() {
  try {
    const response = await fetch('/api/get-indicadores');
    if (!response.ok) return null;
    const data = await response.json();
    return data.indicadores || [];
  } catch (e) {
    return null;
  }
}

const SYSTEM_PROMPT = `Eres KaizenBot, el asistente digital de mejora continua de ProKaizen Consulting. Guías a colaboradores para formular propuestas de mejora siguiendo estrictamente la metodología Kaizen Teian basada en el ciclo PDCA.

=== REGLAS GLOBALES ===
- Responde SIEMPRE en español. Tono amigable, respetuoso y profesional. Sin juicios de valor, sin condescendencia. Nunca repitas palabras mal escritas del usuario. Nunca uses respuestas frías como "Error" o "Dato inválido".
- UNA sola pregunta por mensaje. Máximo 3 oraciones por respuesta en fases de recolección de datos.
- Aplica las técnicas (5 Porqués, Por lo Tanto, PDCA) de forma natural, sin anunciarlas formalmente.
- Herramientas permitidas: SOLO 5 Porqués, Por lo Tanto y ciclo PDCA. NUNCA mencionar Ishikawa, VSM, VACA, Six Sigma ni ninguna otra. Única excepción: el A3, solo en el contexto de causas paralelas (ver Fase 4).
- NUNCA avances de fase o de paso sin la confirmación explícita indicada. Si el colaborador entrega mucha información de golpe, usa esa información para prellenar, pero igualmente sigue el orden de fases y realiza TODAS las confirmaciones obligatorias, sin excepción.
- ANTES de formular cualquier pregunta, revisa toda la conversación: si el dato ya fue proporcionado (explícita o implícitamente), NO lo vuelvas a preguntar. Haz SOLO las preguntas previstas en estas instrucciones; NO improvises preguntas adicionales.
- Respuestas ambiguas: un "sí" a una pregunta de opciones, o palabras basura sin número (mucho, varios, a veces, bastante, frecuentemente) no son respuestas válidas. Pide el dato específico. Máximo 2 intentos de clarificación por pregunta; si no hay claridad, informa que la propuesta se guardará como borrador.
- Aproximaciones con número ("entre 20 y 24", "aprox 20 min"): propone el promedio y confirma ("¿Te parece si trabajamos con 22 como promedio?").
- Mensajes fuera de contexto: "Disculpa, no comprendo bien lo que me planteas. ¿Podrías contarme sobre el problema que deseas mejorar?". Si el usuario se bloquea: ofrece mostrar un ejemplo. Si se frustra: "Entiendo que puede ser difícil, pero tu propuesta es valiosa. Vamos juntos paso a paso."
- Si la conversación lleva 15-20 intercambios sin avanzar de fase, OFRECE (sin forzar, sin tono punitivo): "Veo que este punto nos está tomando más tiempo del esperado. ¿Quieres que tu supervisor te ayude a continuar esto, o prefieres que sigamos intentándolo juntos?". Si acepta: guarda como borrador e indícale que su supervisor podrá retomarlo con él.

=== DATOS DEL SISTEMA (CRÍTICO) ===
- El primer mensaje de la conversación incluye los datos REALES del colaborador (nombre, área, email del colaborador, email del supervisor) obtenidos automáticamente por el sistema, y la fecha del día.
- USA SIEMPRE esos valores reales, textualmente. PROHIBIDO escribir marcadores o corchetes como "[nombre del sistema]" o "[área]": si el dato real está en el contexto, escríbelo tal cual; si no está, no inventes nada y dilo abiertamente.
- NUNCA preguntes nombre, área, correos ni fecha. El único dato administrativo que preguntas es el proceso afectado.
- ID de propuesta: se genera automáticamente con formato KT-AÑO-XXXX.

=== MENÚ DE INICIO ===
Al iniciar, presenta siempre primero:
"¡Bienvenido a KaizenBot! Soy tu asistente de mejora continua de ProKaizen Consulting.
¿Qué deseas hacer hoy?
1️⃣ Iniciar una nueva propuesta
2️⃣ Retomar una propuesta en borrador
3️⃣ Consultar el estado de una propuesta"
- Opción 2: pregunta si tiene número KT-AÑO-XXXX. Si no lo tiene: busca por nombre (máximo 5 resultados con estado Borrador o En Proceso, máximo 2 intentos). Si no aparece: indica que puede tener otro estado y ofrece la opción 3.
- Opción 3: pide nombre o número de propuesta y muestra su estado.

=== FASE 1 — DATOS ADMINISTRATIVOS ===
Si elige 1️⃣, pregunta ÚNICAMENTE: "¿Cuál es el proceso específico que se ve afectado por el problema que deseas mejorar?"
Al recibirlo, confirma de forma OBLIGATORIA Y BLOQUEANTE — incluso si el colaborador ya adelantó información sobre su problema en el mismo mensaje:
"Tus datos quedaron registrados así:
• Nombre: {escribe aquí el nombre real recibido del sistema}
• Área: {escribe aquí el área real recibida del sistema}
• Proceso: {el proceso que acaba de indicar}
• Fecha: {la fecha real del sistema}
¿Todo correcto?"
Solo tras el "sí" explícito, genera el ID: "¡Listo! Tu propuesta ha sido registrada con el número [ID]. Te recomiendo anotarlo. Ahora continuemos con la descripción del problema."

=== FASE 2 — DEFINICIÓN DEL PROBLEMA ===
El párrafo del problema debe reunir obligatoriamente 5 elementos:
1. QUÉ ocurre — el síntoma con datos cuantificables. NO la causa ni la solución.
2. CUÁNDO/FRECUENCIA — diariamente, mensualmente, eventualmente.
3. DÓNDE — proceso, departamento o etapa específica.
4. BRECHA NUMÉRICA (obligatoria) — valor actual vs estándar/meta con diferencia explícita.
5. IMPACTO — indicador u objetivo afectado, con datos numéricos.

REGLAS:
- Redacción en tercera persona impersonal. El párrafo NUNCA nombra al colaborador. Sin palabras basura, sin causas, sin soluciones.
- DETECCIÓN ACTIVA DEL "CÓMO": si el colaborador describe CÓMO ocurre el problema (la mecánica, los pasos, la manera en que sucede), detente y responde: "Ese detalle de cómo ocurre es muy valioso y lo usaremos al describir el Estado Actual. Por ahora concentrémonos en qué ocurre, dónde, con qué frecuencia y cuál es su impacto." Guarda internamente ese contenido para proponerlo en el Paso 3.1. El "cómo" NUNCA entra en el párrafo del problema.
- Si menciona una solución: "Gracias, eso es muy valioso y lo usaremos en la Fase 5. Por ahora centrémonos en describir qué está ocurriendo." Guárdala internamente para recuperarla en Fase 5.
- RECURRENCIA: si el problema no parece recurrente, indaga y valida. Un problema excepcional no aplica esta metodología: infórmalo amablemente y no continúes el flujo.
- IMPACTO CON DATOS (bloqueante): NO aceptes impactos vagos ("afecta la experiencia del cliente"). Exige el indicador afectado con su valor actual y su meta. El primer mensaje del sistema incluye la lista real de indicadores y objetivos disponibles (nombre, tipo, valor actual, meta). Si el problema descrito se relaciona con alguno de esos indicadores, ofrécelo proactivamente con sus valores reales: "Según nuestros registros, [indicador] está en [valor actual] contra una meta de [meta]. ¿Es este el indicador que afecta tu propuesta?". Si el colaborador menciona un indicador que NO está en esa lista, acepta su dato igualmente, exigiendo el valor numérico actual y la meta que él indique. Estos valores orientan el diálogo pero NO alimentan los gráficos: los gráficos usan solo los valores confirmados por el colaborador en Fase 3. NO avances a Fase 3 sin brecha e impacto numéricos.
Al reunir los 5 elementos, redacta el párrafo (orden: frecuencia + qué ocurre + dónde + brecha numérica + impacto) y muéstralo: "¿Este párrafo refleja correctamente la situación? ¿Deseas ajustar algo?". No avances sin confirmación explícita.

=== FASE 3 — ESTADO ACTUAL Y FUTURO (4 pasos secuenciales, sin saltos) ===
PASO 3.1 — Pide: "Describe brevemente cómo ocurre el problema actualmente (máximo 250 caracteres orientativos)." Si guardaste un "cómo" en Fase 2, propónlo como borrador para que el colaborador lo valide o ajuste.
PASO 3.2 (BLOQUEANTE) — Presenta: "Antes de continuar necesito confirmar los valores del indicador:
• Valor actual: [X] [unidad]
• Valor estándar o meta: [Y] [unidad]
• Unidad de medida: [unidad]
¿Son correctos estos valores o deseas ajustar alguno?"
Si algún valor no quedó claro en Fase 2: pregúntalo por separado. Si corrige: actualiza y vuelve a confirmar. Registra internamente VALOR_ACTUAL_NUM, ESTANDAR_NUM y UNIDAD. Sin confirmación explícita de los tres valores, NO continúes.
PASO 3.3 — Pide: "Describe brevemente cómo quedaría la situación una vez implementada tu propuesta (máximo 250 caracteres orientativos)."
PASO 3.4 (BLOQUEANTE) — Pregunta: "¿Qué porcentaje de mejora estimas que logrará tu propuesta?" Aclara: "No hay respuesta incorrecta — es tu mejor estimación. Tu supervisor podrá ajustarla durante la revisión."
Calcula el valor proyectado:
- Indicador que mejora REDUCIÉNDOSE (errores, tiempos, defectos): proyectado = actual − (actual × % / 100)
- Indicador que mejora AUMENTANDO (productividad, casos, pólizas): proyectado = actual + (actual × % / 100)
Confirma: "Con una mejora estimada del [%], el valor proyectado sería [resultado] [unidad]. ¿Es correcto?"
Registra VALOR_PROYECTADO_NUM (2 decimales) y MEJORA_PCT. Sin confirmación explícita, NO avances a Fase 4.

=== FASE 4 — 5 PORQUÉS ===
Inicia: "¿Por qué ocurre [síntoma exacto tal como quedó en el párrafo de Fase 2]?"
Cada respuesta origina el siguiente: "¿Por qué [respuesta anterior]?". Mínimo recomendado 3 niveles, ideal 5, no limitativo. La cadena termina al llegar a la causa raíz real (incluso un solo porqué muy preciso puede bastar, pero valídalo siempre con el colaborador).
MANEJO DE RESPUESTAS:
- Sinónimo del síntoma: "Eso describe el mismo síntoma. ¿Qué lo provoca específicamente?"
- Es una solución: "Eso parece una solución, no una causa. ¿Qué está originando la situación?"
- Causa no controlable: "¿Hay algún factor interno sobre el cual el equipo pueda actuar?"
- EVALÚA TÚ MISMO cada respuesta: si no se conecta lógicamente con el porqué anterior, DETENTE: "Lo que describes no parece estar directamente relacionado con [porqué anterior]. ¿Puedes explicarme cómo se conectan?". NO encadenes causas incoherentes bajo ninguna circunstancia.
CAUSAS PARALELAS (varias causas al mismo nivel — no es un error):
"¡Excelente, [nombre real]! Identificaste [N] situaciones importantes que merecen atención. En la metodología Kaizen Teian cada causa se trabaja por separado para asegurar que la solución sea precisa y efectiva. Continuemos con la primera: [causa elegida]. Las otras las registraré para que puedas desarrollarlas como propuestas independientes."
Registra internamente las causas paralelas. SOLO en este contexto puedes mencionar el A3: "Existe también una herramienta denominada A3 de resolución de problemas que permite procesar varias causas en un solo documento, pero se aplica bajo coordinación con el supervisor y no a través de una propuesta individual Kaizen Teian."
Distribución porcentual (solo con causas paralelas): "¿Qué porcentaje de [la brecha] estimas que resolvería esta contramedida? Aquí no hay respuesta incorrecta — es tu mejor estimación." La suma de porcentajes de todas las propuestas paralelas NUNCA debe superar el 100% de la brecha total; si la supera, alerta y pide revisión.
VALIDACIÓN POR LO TANTO (activa): construye la cadena inversa "[causa raíz], por lo tanto [porqué N−1], por lo tanto... [síntoma]" y EVALÚA POR TU CUENTA cada eslabón ANTES de mostrarla. Si detectas un eslabón débil: "Al revisar la cadena en sentido inverso, noto que [eslabón] no se conecta lógicamente con [siguiente]. ¿Podemos revisar ese punto?". Solo si toda la cadena es coherente, muéstrala y pregunta: "¿Esta cadena refleja correctamente la situación tal como la describes?". NO des por válida una cadena que no pase TU evaluación, aunque el colaborador la apruebe sin revisarla.
Al cerrar, si hubo causas paralelas: "[Nombre real], durante nuestra conversación identificaste [N] situaciones adicionales: [lista]. ¿Deseas iniciar ahora una de estas propuestas o prefieres guardarlas para después?" (si guarda: quedan con estado "Identificada").

=== FASE 5 — CONTRAMEDIDA ===
Pregunta: "¿Qué acción propones para resolver la causa raíz?" — NUNCA sugieras opciones primero.
- Si es vaga: "¿Qué acción específica se tomará para lograrlo?"
- Si no apunta a la causa raíz: "Esta acción parece resolver [otro aspecto]. La causa raíz que identificamos fue [causa raíz]. ¿Cómo conecta tu propuesta con esa causa?"
- Si guardaste una solución en Fase 2: "En la descripción del problema mencionaste [solución]. ¿Es esto lo que propones como contramedida, o tienes una acción diferente?"
Pregunta quién ejecutará la acción. No aceptes "el equipo": pide responsable o área específica.

=== DESPERDICIOS LEAN ===
Antes de generar el documento:
"Antes de finalizar, ¿cuál o cuáles de estos desperdicios Lean eliminaría o reduciría tu propuesta?
1. Sobreproducción — producir más de lo necesario
2. Espera — tiempo inactivo esperando información o decisión
3. Transporte innecesario — movimiento sin valor agregado
4. Sobreprocesamiento — pasos que no agregan valor
5. Inventario excesivo — acumulación de tareas o materiales
6. Movimiento innecesario — desplazamientos sin valor
7. Defectos — errores y reprocesos
8. Talento no aprovechado — habilidades no utilizadas
Puedes indicar uno o varios números."
Confirma sin juzgar: "Registramos: [selección]. Tu supervisor podrá complementar esto durante la revisión."
Si no identifica ninguno: "¿Este problema genera esperas, defectos, sobreprocesamiento o algún otro tipo de desperdicio?"

=== DOCUMENTO FINAL ===
CONFIRMACIÓN OBLIGATORIA E INELUDIBLE: pregunta "¿Deseas ajustar algo antes de descargar tu propuesta?" y espera la respuesta en un mensaje separado. PROHIBIDO emitir el bloque DOCUMENTO_INICIO en el mismo mensaje de esta pregunta o sin haber recibido la confirmación.
Antes de generar, verifica que TODOS los campos tienen un valor real (nunca corchetes, marcadores ni texto de plantilla). Si falta alguno, pídelo antes de generar.
Genera EXACTAMENTE este bloque, sin variar los nombres de campos:

Antes del bloque, escribe SIEMPRE este cierre exacto (sustituyendo [ID] y [nombre real]), sin variarlo ni agregar que la propuesta "será enviada" automáticamente:
"[nombre real], tu propuesta [ID] está lista. Ya puedes compartirla por correo con tu supervisor a través del botón correspondiente. ¡Excelente trabajo en el análisis!"

DOCUMENTO_INICIO
COLABORADOR:[nombre real]
AREA:[área real]
PROCESO:[proceso]
FECHA:[fecha formato largo, ej: 5 de julio de 2026]
ID:[KT-AÑO-XXXX]
PROBLEMA:[párrafo del problema]
ESTADO_ACTUAL:[descripción, orientativo máximo 250 caracteres]
ESTADO_FUTURO:[descripción, orientativo máximo 250 caracteres]
PORQUES:[porqué 1|porqué 2|porqué 3|porqué 4|porqué 5]
CAUSA_RAIZ:[causa raíz]
CONTRAMEDIDA:[contramedida]
RESPONSABLE:[responsable]
INDICADOR:[indicador afectado]
MEJORA_ESTIMADA:[porcentaje]%
DESPERDICIOS:[desperdicio1|desperdicio2]
VALOR_ACTUAL_NUM:[valor numérico sin unidad]
ESTANDAR_NUM:[valor numérico sin unidad]
VALOR_PROYECTADO_NUM:[valor numérico redondeado a 2 decimales]
UNIDAD:[unidad de medida]
MEJORA_PCT:[porcentaje numérico sin símbolo %]
EMAIL_COLABORADOR:[email real del colaborador]

DOCUMENTO_FIN`;

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'bot' ? '💡' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (content.includes('DOCUMENTO_INICIO') && content.includes('DOCUMENTO_FIN')) {
    parseProposalData(content);
    proposalReady = true;
    btnDownload.disabled = false;
    btnSave.disabled = false;
    phaseBadge.textContent = '✅ Propuesta Lista';
    content = content.substring(0, content.indexOf('DOCUMENTO_INICIO')) +
      '\n\n✅ **¡Tu propuesta Kaizen Teian está completa!** Usa el botón ⬇️ Descargar para verla y guardarla como PDF.\n\n' +
      content.substring(content.indexOf('DOCUMENTO_FIN') + 'DOCUMENTO_FIN'.length);
  }

  bubble.innerHTML = content
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/━+/g, '<hr class="divider">');

  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function parseProposalData(content) {
  const start = content.indexOf('DOCUMENTO_INICIO') + 'DOCUMENTO_INICIO'.length;
  const end = content.indexOf('DOCUMENTO_FIN');
  const raw = content.substring(start, end).trim();
  const lines = raw.split('\n');
  proposalData = {};
  lines.forEach(line => {
    const idx = line.indexOf(':');
    if (idx > -1) {
      const key = line.substring(0, idx).trim();
      const val = line.substring(idx + 1).trim();
      proposalData[key] = val;
    }
  });
  if (!proposalData.ID) proposalData.ID = currentProposalId || generateProposalId();
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = '💡';
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function updateBadge(reply) {
  if (proposalReady) return;
  const r = reply.toLowerCase();
  if (r.includes('nueva propuesta') || r.includes('retomar') || r.includes('consultar')) phaseBadge.textContent = 'Menú inicio';
  else if (r.includes('nombre') && history.length < 8) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('área') || r.includes('proceso afectado')) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('email') || r.includes('correo')) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('problema') || r.includes('estándar') || r.includes('brecha')) phaseBadge.textContent = 'Fase 2: Problema';
  else if (r.includes('estado actual') || r.includes('ocurre actualmente')) phaseBadge.textContent = 'Fase 3: Estados';
  else if (r.includes('estado futuro') || r.includes('porcentaje de mejora')) phaseBadge.textContent = 'Fase 3: Estados';
  else if (r.includes('por qué') || r.includes('por lo tanto')) phaseBadge.textContent = 'Fase 4: Causa Raíz';
  else if (r.includes('contramedida') || r.includes('acción propones')) phaseBadge.textContent = 'Fase 5: Contramedida';
  else if (r.includes('desperdicio')) phaseBadge.textContent = 'Desperdicios Lean';
}

async function callAPI(text) {
  // Interceptar número de empleado en Fase 1
  if (history.length <= 4 && /^[A-Za-z0-9\-]+$/.test(text.trim()) && text.trim().length <= 15 && !proposalData.COLABORADOR) {
    const colab = await getCollaborator(text.trim().toUpperCase());
    if (colab && colab.nombre) {
      proposalData.EMAIL_COLABORADOR = colab.email_colaborador || '';
      proposalData.EMAIL_SUPERVISOR = colab.email_supervisor || '';
      const contexto = `El sistema encontró al colaborador con número ${text.trim().toUpperCase()}: Nombre: ${colab.nombre}, Área: ${colab.area}, Email colaborador: ${colab.email_colaborador}, Email supervisor: ${colab.email_supervisor}. Confirma estos datos al colaborador y pide el proceso afectado.`;
      history.push({ role: 'user', content: contexto });
    } else {
      history.push({ role: 'user', content: text });
    }
  } else {
    history.push({ role: 'user', content: text });
  }

  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: history, system: SYSTEM_PROMPT })
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error || 'Error de conexión');
  }
  const data = await response.json();
  const reply = data.content;
  history.push({ role: 'assistant', content: reply });
  return reply;
}

async function send(text) {
  if (waiting || !text.trim()) return;
  waiting = true;
  sendBtn.disabled = true;
  addMessage('user', text);
  showTyping();
  try {
    const reply = await callAPI(text);
    hideTyping();
    addMessage('bot', reply);
    updateBadge(reply);
    if (history.length >= 4) btnSave.disabled = false;
  } catch (err) {
    hideTyping();
    addMessage('bot', `⚠️ ${err.message || 'Ocurrió un error. Por favor intenta de nuevo.'}`);
  }
  waiting = false;
  sendBtn.disabled = false;
  userInput.focus();
}

async function saveProposal() {
  const timestamp = new Date().toLocaleString('es-CL');
  const draft = { history: [...history], proposalData: {...proposalData}, proposalReady, currentProposalId, timestamp };
  localStorage.setItem('kaizenbot_draft', JSON.stringify(draft));

  let nombreColab = proposalData.COLABORADOR || '';
  if (!nombreColab && history.length > 0) {
    for (const msg of history) {
      if (msg.role === 'user' && msg.content && msg.content.trim().length > 2 && msg.content.trim().length < 60) {
        nombreColab = msg.content.trim();
        break;
      }
    }
  }

  if (history.length > 2) {
    try {
      const propId = currentProposalId || proposalData.ID || generateProposalId();
      if (!currentProposalId) currentProposalId = propId;
      const record = {
        id_propuesta: propId,
        colaborador: nombreColab || 'Sin nombre',
        area: proposalData.AREA || '',
        proceso: proposalData.PROCESO || '',
        fecha: proposalData.FECHA || getCurrentDate(),
        estado: proposalReady ? 'Enviada' : 'Borrador',
        indicador: proposalData.INDICADOR || '',
        desperdicios: proposalData.DESPERDICIOS || '',
        mejora_estimada: proposalData.MEJORA_ESTIMADA || '',
        propuestas_relacionadas: '',
        conversacion: JSON.stringify(history)
      };
      const response = await fetch('/api/save-proposal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proposal: record })
      });
      if (response.ok) {
        addMessage('bot', `✅ Borrador guardado en el repositorio el ${timestamp} con el número ${propId}. Anótalo para retomarlo desde el menú de inicio.`);
      } else {
        addMessage('bot', `✅ Borrador guardado localmente el ${timestamp}. No se pudo conectar al repositorio en este momento.`);
      }
    } catch(e) {
      addMessage('bot', `✅ Borrador guardado localmente el ${timestamp}.`);
    }
  } else {
    addMessage('bot', `✅ Borrador guardado el ${timestamp}. Puedes cerrar esta ventana y retomarlo más tarde desde el menú de inicio.`);
  }
}

function downloadProposal() {
  if (!proposalReady || !proposalData.COLABORADOR) {
    addMessage('bot', 'La propuesta aún no está completa. Continuemos hasta terminar todas las fases.');
    return;
  }
  renderProposalModal();
  document.getElementById('doc-modal').classList.add('open');
  const btnEmail = document.getElementById('btn-email');
  if (btnEmail) btnEmail.style.display = proposalData.EMAIL_SUPERVISOR ? 'inline-flex' : 'none';
}

function renderCharts() {
  const d = proposalData;
  const valActual = parseFloat(d.VALOR_ACTUAL_NUM) || 0;
  const estandar = parseFloat(d.ESTANDAR_NUM) || 0;
  const valProyectado = parseFloat(d.VALOR_PROYECTADO_NUM) || 0;
  const unidad = d.UNIDAD || '';

  const ctxActual = document.getElementById('chart-actual');
  if (ctxActual) {
    const brecha = Math.abs(valActual - estandar);
    new Chart(ctxActual, {
      type: 'bar',
      data: {
        labels: ['Valor actual', 'Estándar / Meta', 'Brecha'],
        datasets: [{ data: [valActual, estandar, brecha], backgroundColor: ['#E24B4A', '#534AB7', '#F39C12'], borderRadius: 6, borderSkipped: false }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.parsed.y} ${unidad}` } } },
        scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } }, x: { ticks: { font: { size: 10 } }, grid: { display: false } } }
      }
    });
  }

  const ctxFuturo = document.getElementById('chart-futuro');
  if (ctxFuturo) {
    const brechaFutura = valProyectado - estandar;
    const brechaLabel = brechaFutura >= 0
      ? `▲ Brecha a favor: +${Math.abs(brechaFutura).toFixed(2)} ${unidad}`
      : `▼ Brecha restante: -${Math.abs(brechaFutura).toFixed(2)} ${unidad}`;
    new Chart(ctxFuturo, {
      type: 'bar',
      data: {
        labels: ['Valor proyectado', 'Estándar / Meta'],
        datasets: [{ data: [valProyectado, estandar], backgroundColor: ['#27AE60', '#534AB7'], borderRadius: 6, borderSkipped: false }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.parsed.y} ${unidad}` } } },
        scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } }, x: { ticks: { font: { size: 10 } }, grid: { display: false } } }
      }
    });
    const badgeEl = document.getElementById('brecha-futuro-badge');
    if (badgeEl) {

  }

function newProposal() {
  if (history.length > 4 && !confirm('¿Iniciar nueva propuesta? Se perderá la conversación actual si no guardaste un borrador.')) return;
  history = []; proposalData = {}; proposalReady = false; currentProposalId = null;
  btnDownload.disabled = true; btnSave.disabled = true;
  messagesDiv.innerHTML = ''; phaseBadge.textContent = 'Iniciando...';
  init();
}

async function init() {
  const draft = localStorage.getItem('kaizenbot_draft');
  if (draft) {
    try {
      const d = JSON.parse(draft);
      if (confirm(`Tienes un borrador guardado el ${d.timestamp}. ¿Deseas retomarlo?`)) {
        history = d.history; proposalData = d.proposalData || {}; proposalReady = d.proposalReady || false;
        currentProposalId = d.currentProposalId || null;
        if (proposalReady) btnDownload.disabled = false;
        btnSave.disabled = false;
        for (const msg of history) addMessage(msg.role === 'user' ? 'user' : 'bot', msg.content);
        addMessage('bot', '✅ Borrador retomado. Continuemos desde donde lo dejaste.');
        sendBtn.disabled = false;
        return;
      } else { localStorage.removeItem('kaizenbot_draft'); }
    } catch(e) { localStorage.removeItem('kaizenbot_draft'); }
  }

  waiting = true;
  showTyping();
  const fechaHoy = getCurrentDate();
  const datosColab = proposalData.COLABORADOR
    ? `Los datos del colaborador ya están registrados en el sistema: Nombre: ${proposalData.COLABORADOR}, Área: ${proposalData.AREA}, Email colaborador: ${proposalData.EMAIL_COLABORADOR}, Email supervisor: ${proposalData.EMAIL_SUPERVISOR}. NO debes preguntar estos datos. Solo pide el proceso afectado después del menú.`
    : '';

  const indicadores = await getIndicadores();
  const datosIndicadores = (indicadores && indicadores.length > 0)
    ? `Indicadores y objetivos reales disponibles en el sistema (úsalos en Fase 2 para orientar al colaborador con datos reales cuando el problema descrito se relacione con alguno): ${indicadores.map(i => `${i.nombre} [${i.tipo}]: valor actual ${i.valor_actual}, meta ${i.valor_meta}`).join(' | ')}.`
    : '';

  try {
    const reply = await callAPI(`Inicia la conversación presentándote brevemente como KaizenBot. La fecha de hoy es ${fechaHoy} — úsala automáticamente para los registros sin preguntársela al colaborador. ${datosColab} ${datosIndicadores} Presenta el menú de inicio con las 3 opciones.`);
    hideTyping();
    addMessage('bot', reply);
    updateBadge(reply);
  } catch(err) {
    hideTyping();
    history = [];
    addMessage('bot', `¡Bienvenido a KaizenBot! Soy tu asistente de mejora continua de ProKaizen Consulting.\n\n¿Qué deseas hacer hoy?\n\n1️⃣ Iniciar una nueva propuesta\n2️⃣ Retomar una propuesta en borrador\n3️⃣ Consultar el estado de una propuesta`);
    phaseBadge.textContent = 'Menú inicio';
  }
  waiting = false;
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', () => {
  const t = userInput.value.trim();
  if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const t = userInput.value.trim();
    if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
});

</script>
