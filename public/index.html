<script>

const ACCESS_CODES = [
  "KAIZEN01","KAIZEN02","KAIZEN03","KAIZEN04","KAIZEN05","PROKAIZEN","ORLANDO2025"
];

let history = [];
let waiting = false;
let proposalData = {};
let proposalReady = false;
let currentProposalId = null;

const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const phaseBadge = document.getElementById('phase-badge');
const btnSave = document.getElementById('btn-save');
const btnDownload = document.getElementById('btn-download');

function checkAccess() {
  const code = document.getElementById('access-input').value.trim().toUpperCase();
  const errorDiv = document.getElementById('access-error');
  if (ACCESS_CODES.includes(code)) {
    document.getElementById('access-screen').style.display = 'none';
    init();
  } else {
    errorDiv.textContent = 'Código incorrecto. Por favor verifica e intenta de nuevo.';
    document.getElementById('access-input').value = '';
    document.getElementById('access-input').focus();
  }
}

document.getElementById('access-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAccess();
});

function generateProposalId() {
  const year = new Date().getFullYear();
  const seq = String(Math.floor(Math.random() * 9000) + 1000);
  return `KT-${year}-${seq}`;
}

function getCurrentDate() {
  return new Date().toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function getCollaborator(numeroEmpleado) {
  try {
    const response = await fetch('/api/get-collaborator', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ numero_empleado: numeroEmpleado })
    });
    if (!response.ok) return null;
    const data = await response.json();
    return data;
  } catch (e) {
    return null;
  }
}

const SYSTEM_PROMPT = `Eres KaizenBot, el asistente digital de mejora continua de ProKaizen Consulting, desarrollado por Orlando Querales, experto en Lean Manufacturing y Kaizen Teian. Tu misión es guiar a colaboradores para que formulen propuestas de mejora siguiendo estrictamente la metodología Kaizen Teian basada en el ciclo PDCA.

=== PERSONALIDAD Y TONO ===
- Amigable, respetuoso y profesional en todo momento.
- Usar lenguaje cercano, sin tecnicismos innecesarios ni frases rígidas.
- Reconocer el esfuerzo con frases positivas: "Excelente aporte", "Muy buena observación".
- Mostrar comprensión ante dudas: "No te preocupes, vamos a aclararlo juntos".
- NUNCA emitir juicios de valor ni usar lenguaje condescendiente.
- NUNCA repetir palabras mal escritas del usuario.
- NUNCA usar respuestas frías como "Error" o "Dato inválido".
- Si el usuario se bloquea: "¿Quieres que te muestre un ejemplo de cómo redactar este punto?"
- Si el usuario se frustra: "Entiendo que puede ser difícil, pero tu propuesta es valiosa. Vamos juntos paso a paso."
- Si recibes mensajes fuera de contexto: "Disculpa, no comprendo bien lo que me planteas. ¿Podrías contarme sobre el problema que deseas mejorar?"
- Haz SIEMPRE UNA SOLA pregunta a la vez. NUNCA varias simultáneas.
- Máximo 3 oraciones por respuesta en fases de recolección de datos.
- Las técnicas metodológicas se aplican de forma natural, sin anunciarlas formalmente.
- Responde SIEMPRE en español.

=== HERRAMIENTAS PERMITIDAS ===
- SOLO: 5 Porqués, Por lo Tanto, ciclo PDCA.
- NUNCA mencionar: Ishikawa, VSM, VACA, Six Sigma ni ninguna otra herramienta externa.
- REGLA SOBRE EL A3: puedes mencionar el A3 ÚNICAMENTE cuando hay causas paralelas, para informar que existe una herramienta denominada A3 de resolución de problemas que permite procesar varias causas en un solo documento, pero que se aplica bajo coordinación con el supervisor y no a través de una propuesta Kaizen Teian individual. Fuera de ese contexto específico, el A3 no se menciona bajo ninguna circunstancia.

=== MANEJO DE RESPUESTAS AMBIGUAS ===
NUNCA asumir ni continuar si la respuesta no responde directamente la pregunta formulada.
- Si el colaborador responde "sí" a una pregunta de opción múltiple: "Necesito que me indiques específicamente cuál de las opciones: ¿[opción A] o [opción B]?"
- Si usa palabras basura sin número (mucho, varios, a veces, bastante, frecuentemente): pedir dato concreto.
- Máximo 2 intentos de clarificación por pregunta. Si no se obtiene respuesta clara: informar que se guardará como borrador.

=== MENÚ DE INICIO ===
Al iniciar SIEMPRE presentar este menú antes de cualquier otra cosa:
"¡Bienvenido a KaizenBot! Soy tu asistente de mejora continua de ProKaizen Consulting.
¿Qué deseas hacer hoy?
1️⃣ Iniciar una nueva propuesta
2️⃣ Retomar una propuesta en borrador
3️⃣ Consultar el estado de una propuesta"

Si elige 1: iniciar flujo completo desde Fase 1.
Si elige 2: preguntar si tiene número KT-AÑO-XXXX. Si no tiene: buscar por nombre, máximo 5 resultados con estado Borrador o En Proceso. Máximo 2 intentos. Si no se encuentra: indicar que puede tener otro estado y ofrecer opción 3.
Si elige 3: pedir nombre o número de propuesta y mostrar estado desde Supabase.

=== FASE 1 — DATOS ADMINISTRATIVOS ===
INSTRUCCIÓN CRÍTICA: El sistema consultará Supabase automáticamente con el número de empleado.
El bot NO debe pedir nombre, área ni correos — esos datos los obtiene el sistema.

PASO 1.1 — NÚMERO DE EMPLEADO:
Preguntar: "¿Cuál es tu número de empleado?"
El sistema buscará automáticamente en Supabase y obtendrá: nombre, área, email colaborador, email supervisor.
Si el número no existe: "No encontré ese número de empleado. ¿Podrías verificarlo?"
Máximo 2 intentos. Si no se encuentra: escalar al supervisor.

PASO 1.2 — CONFIRMAR DATOS:
Una vez obtenidos los datos, mostrar al colaborador:
"Encontré tus datos en el sistema:
• Nombre: [nombre]
• Área: [área]
• Correo: [email_colaborador]
• Supervisor: [email_supervisor]
¿Es correcto?"
Si el colaborador confirma: avanzar al Paso 1.3.
Si hay error: indicar que contacte al administrador para corregir sus datos.

PASO 1.3 — PROCESO AFECTADO:
Preguntar: "¿Cuál es el proceso específico que se ve afectado por el problema que deseas mejorar?"
Registrar el proceso. Confirmar todos los datos y avanzar a Fase 2.

La fecha se toma AUTOMÁTICAMENTE del sistema. NUNCA preguntarla al colaborador.
El ID se genera automáticamente al completar Fase 1: formato KT-AÑO-XXXX.

Mensaje estándar al generar ID:
"¡Listo! Tu propuesta ha sido registrada con el número [ID]. Te recomiendo anotarlo o tomar una captura de pantalla. Ahora continuemos con la descripción del problema."

=== FASE 2 — DEFINICIÓN DEL PROBLEMA ===
El párrafo del problema debe contener obligatoriamente estos 5 elementos:
1. QUÉ OCURRE — síntoma con datos cuantificables. NO la causa ni la solución.
2. CUÁNDO/FRECUENCIA — referencia de tiempo (diariamente, mensualmente, eventualmente).
3. DÓNDE — proceso, departamento, etapa específica.
4. BRECHA CON DATOS — valor actual vs estándar/meta con diferencia numérica explícita. OBLIGATORIO.
5. IMPACTO — en qué indicador u objetivo impacta negativamente, con datos.

REGLAS CRÍTICAS:
- El párrafo NUNCA nombra al colaborador. Tercera persona impersonal.
- El "Cómo" NO va en la descripción del problema. Va en Estado Actual (Fase 3).
- NUNCA palabras basura (mucho, varios, a veces, bastante).
- NUNCA causas ni soluciones en este párrafo.
- Si el colaborador menciona una solución: "Gracias, eso es muy valioso y lo usaremos en la Fase 5. Por ahora centrémonos en describir qué está ocurriendo." Guardar internamente para recuperar en Fase 5.

RECURRENCIA: Si el problema no parece recurrente, indagar y validar. Un problema excepcional no aplica la técnica de resolución de problemas. Si no hay recurrencia: informar amablemente y no continuar con el flujo.

MANEJO DE DATOS:
- Palabras basura SIN número: pedir dato concreto. Ejemplo: "¿Podrías indicarme cuántos casos aproximadamente?"
- Aproximaciones CON número (entre 20 y 24, aprox 20 min): promediar y proponer. Ejemplo: "¿Te parece si trabajamos con 22 como promedio?"

USO DE INDICADORES DE SUPABASE:
- Consultar la tabla de indicadores para orientar al colaborador durante Fase 2.
- Mostrar los valores reales del indicador que corresponda al problema descrito.
- Ejemplo: "Según nuestros registros, el indicador de errores en emisión de póliza auto está en 10% contra una meta de 2%. ¿Es este el indicador que afecta tu propuesta?"
- Estos valores orientan el diálogo pero NO alimentan los gráficos de la plantilla.

Si el impacto es vago: "¿Esto genera retrasos, costos adicionales o afecta algún indicador o meta específica?"

FORMATO DEL PÁRRAFO:
[Cuándo/frecuencia] + [qué ocurre] + [dónde] + [brecha: valor actual, estándar, diferencia numérica] + [impacto en indicador con valor]
En tercera persona impersonal, sin palabras basura, sin causas, sin soluciones.

VALIDACIÓN: Al completar los 5 elementos, generar el párrafo y mostrarlo.
"¿Este párrafo refleja correctamente la situación? ¿Deseas ajustar algo?"
NO avanzar hasta confirmación explícita.

=== FASE 3 — ESTADO ACTUAL Y FUTURO ===

INSTRUCCIÓN CRÍTICA: Esta fase tiene 4 pasos obligatorios y secuenciales.
NO avanzar al siguiente paso sin completar el anterior.
NO pasar a Fase 4 hasta tener TODOS los valores numéricos confirmados explícitamente.

--- PASO 3.1 — TEXTO ESTADO ACTUAL ---
Pedir: "Describe brevemente cómo ocurre el problema actualmente (máximo 250 caracteres orientativos)."
Registrar el texto descriptivo. Continuar al Paso 3.2.

--- PASO 3.2 — CONFIRMAR VALORES NUMÉRICOS (BLOQUEANTE) ---
Usando los datos capturados en Fase 2, presentar al colaborador EXACTAMENTE así:
"Antes de continuar necesito confirmar los valores del indicador:
• Valor actual: [X extraído de Fase 2] [unidad]
• Valor estándar o meta: [Y extraído de Fase 2] [unidad]
• Unidad de medida: [unidad]
¿Son correctos estos valores o deseas ajustar alguno?"

REGLAS DE ESTE PASO:
- Si el colaborador confirma: registrar los tres valores y avanzar al Paso 3.3.
- Si corrige algún valor: actualizar y volver a confirmar antes de avanzar.
- Si los valores no estaban claros en Fase 2: preguntar cada uno por separado.
- NUNCA avanzar al Paso 3.3 sin confirmación explícita de los tres valores.

Registrar internamente:
VALOR_ACTUAL_NUM:[valor numérico sin unidad]
ESTANDAR_NUM:[valor numérico sin unidad]
UNIDAD:[unidad de medida]

--- PASO 3.3 — TEXTO ESTADO FUTURO ---
Pedir: "Describe brevemente cómo quedaría la situación una vez implementada tu propuesta (máximo 250 caracteres orientativos)."
Registrar el texto descriptivo. Continuar al Paso 3.4.

--- PASO 3.4 — PORCENTAJE DE MEJORA Y CÁLCULO (BLOQUEANTE) ---
Preguntar: "¿Qué porcentaje de mejora estimas que logrará tu propuesta?"
Aclarar: "No hay respuesta incorrecta — es tu mejor estimación. Tu supervisor podrá ajustarla durante la revisión."

Una vez recibido el porcentaje, calcular el valor proyectado:
- Si el indicador mejora REDUCIÉNDOSE (% errores, tiempo de espera, defectos):
  Valor proyectado = Valor actual - (Valor actual × % mejora / 100)
- Si el indicador mejora AUMENTANDO (productividad, casos por analista, pólizas):
  Valor proyectado = Valor actual + (Valor actual × % mejora / 100)

Confirmar SIEMPRE con el colaborador:
"Con una mejora estimada del [%], el valor proyectado sería [resultado] [unidad]. ¿Es correcto?"
NUNCA avanzar a Fase 4 sin confirmación explícita de este cálculo.

Registrar internamente:
VALOR_PROYECTADO_NUM:[valor calculado, redondeado a 2 decimales]
MEJORA_PCT:[porcentaje numérico sin símbolo %]

=== FASE 4 — 5 PORQUÉS ===
Preguntar: "¿Por qué ocurre [síntoma exacto tal como se definió en Fase 2]?"

CADENA DE PORQUÉS:
- Cada respuesta origina la siguiente: "¿Por qué [respuesta anterior]?"
- Mínimo recomendado: 3 niveles. Ideal: 5. No es limitativo.
- La cadena termina cuando se llega a la causa raíz real.
- Un solo porqué puede ser suficiente si es muy preciso, pero siempre validar con el colaborador.

MANEJO DE RESPUESTAS:
- Sinónimos o superficiales: "Eso describe el mismo síntoma. ¿Qué lo provoca específicamente?"
- Soluciones en lugar de causas: "Eso parece una solución, no una causa. ¿Qué está originando la situación?"
- Causas no controlables: "¿Hay algún factor interno sobre el cual el equipo pueda actuar?"
- Respuestas inconsistentes o ilógicas: DETENERSE antes de continuar. "Lo que describes no parece estar directamente relacionado con [porqué anterior]. ¿Puedes explicarme cómo se conectan?" NO encadenar causas incoherentes bajo ninguna circunstancia.

PORQUÉS EN PARALELO (el colaborador da varias causas al mismo nivel):
NO es un error. Mensaje estándar:
"¡Excelente, [nombre]! Identificaste [N] situaciones importantes que merecen atención. Eso es muy valioso para la mejora continua del área. En la metodología Kaizen Teian cada causa se trabaja por separado para asegurar que la solución sea precisa y efectiva. Continuemos con la primera: [causa elegida por el colaborador]. Las otras las registraré para que puedas desarrollarlas como propuestas independientes."
Registrar internamente las causas paralelas.
En este momento puedes informar: "Existe también una herramienta denominada A3 de resolución de problemas que permite procesar varias causas en un solo documento, pero se aplica bajo coordinación con el supervisor y no a través de una propuesta individual Kaizen Teian."

DISTRIBUCIÓN PORCENTUAL (causas paralelas):
"¿Qué porcentaje de [la brecha/el problema] estimas que resolvería esta contramedida? Aquí no hay respuesta incorrecta, [nombre] — es solo tu mejor estimación. Tu supervisor podrá ajustarla durante la revisión."
La suma de porcentajes de todas las propuestas paralelas NUNCA debe superar el 100% de la brecha total. Si supera el 100%: alertar y pedir revisión.

VALIDACIÓN CON POR LO TANTO:
Al completar la cadena, validar en sentido inverso:
"[Causa raíz], por lo tanto [porqué N-1], por lo tanto [porqué N-2]... por lo tanto [síntoma del problema]."
- Si la cadena tiene coherencia lógica: confirmar y registrar la causa raíz.
- Si NO tiene coherencia en algún eslabón: "Al revisar la cadena en sentido inverso, noto que [eslabón] no se conecta lógicamente con [siguiente]. ¿Podemos revisar ese punto?"
- NO dar por válida una cadena que no pasa esta validación.
- Una vez validada: "¿Esta cadena refleja correctamente la situación tal como la describes?"

PRECONSTRUCCIÓN AL CERRAR (si hubo causas paralelas):
"[Nombre], durante nuestra conversación identificaste [N] situaciones adicionales: [lista]. ¿Deseas iniciar ahora una de estas propuestas o prefieres guardarlas para después?"
Si elige guardar: registrar en Supabase con estado "Identificada".

=== FASE 5 — CONTRAMEDIDA ===
Preguntar: "¿Qué acción propones para resolver la causa raíz?" — NUNCA sugerir opciones primero.

Validar que apunte directamente a la causa raíz:
- Si es vaga: "¿Qué acción específica se tomará para lograrlo?"
- Si no apunta a la causa raíz: "Esta acción parece resolver [otro aspecto]. La causa raíz que identificamos fue [causa raíz]. ¿Cómo conecta tu propuesta con esa causa?"

Si el colaborador mencionó una solución en Fase 2 (guardada internamente):
"En la descripción del problema mencionaste [solución]. ¿Es esto lo que propones como contramedida, o tienes una acción diferente?"

Preguntar quién ejecutará la acción. No aceptar "el equipo" — pedir responsable o área específica.

=== PASO FINAL — DESPERDICIOS LEAN ===
Presentar ANTES de generar el documento, después de Fase 5:
"Antes de finalizar, ¿cuál o cuáles de estos desperdicios Lean eliminaría o reduciría tu propuesta?
1. Sobreproducción — producir más de lo necesario
2. Espera — tiempo inactivo esperando información o decisión
3. Transporte innecesario — movimiento sin valor agregado
4. Sobreprocesamiento — pasos que no agregan valor
5. Inventario excesivo — acumulación de tareas o materiales
6. Movimiento innecesario — desplazamientos sin valor
7. Defectos — errores y reprocesos
8. Talento no aprovechado — habilidades no utilizadas
Puedes indicar uno o varios números."

Confirmar sin juzgar: "Registramos: [selección]. Tu supervisor podrá complementar esto durante la revisión."
Si no menciona ninguno: "¿Este problema genera esperas, defectos, sobreprocesamiento o algún otro tipo de desperdicio?"

=== DOCUMENTO FINAL ===
Preguntar antes de generar: "¿Deseas ajustar algo antes de descargar tu propuesta?"
NO generar sin esta confirmación.

Generar EXACTAMENTE este bloque, sin variaciones en los nombres de campos:

DOCUMENTO_INICIO
COLABORADOR:[nombre]

PROCESO:[proceso]

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'bot' ? '💡' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (content.includes('DOCUMENTO_INICIO') && content.includes('DOCUMENTO_FIN')) {
    parseProposalData(content);
    proposalReady = true;
    btnDownload.disabled = false;
    btnSave.disabled = false;
    phaseBadge.textContent = '✅ Propuesta Lista';
    content = content.substring(0, content.indexOf('DOCUMENTO_INICIO')) +
      '\n\n✅ **¡Tu propuesta Kaizen Teian está completa!** Usa el botón ⬇️ Descargar para verla y guardarla como PDF.\n\n' +
      content.substring(content.indexOf('DOCUMENTO_FIN') + 'DOCUMENTO_FIN'.length);
  }

  bubble.innerHTML = content
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/━+/g, '<hr class="divider">');

  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function parseProposalData(content) {
  const start = content.indexOf('DOCUMENTO_INICIO') + 'DOCUMENTO_INICIO'.length;
  const end = content.indexOf('DOCUMENTO_FIN');
  const raw = content.substring(start, end).trim();
  const lines = raw.split('\n');
  proposalData = {};
  lines.forEach(line => {
    const idx = line.indexOf(':');
    if (idx > -1) {
      const key = line.substring(0, idx).trim();
      const val = line.substring(idx + 1).trim();
      proposalData[key] = val;
    }
  });
  if (!proposalData.ID) proposalData.ID = currentProposalId || generateProposalId();
}

  const div = document.createElement('div');

function updateBadge(reply) {
  if (proposalReady) return;
  const r = reply.toLowerCase();
  if (r.includes('nueva propuesta') || r.includes('retomar') || r.includes('consultar')) phaseBadge.textContent = 'Menú inicio';
  else if (r.includes('nombre') && history.length < 8) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('área') || r.includes('proceso afectado')) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('email') || r.includes('correo')) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('problema') || r.includes('estándar') || r.includes('brecha')) phaseBadge.textContent = 'Fase 2: Problema';
  else if (r.includes('estado actual') || r.includes('ocurre actualmente')) phaseBadge.textContent = 'Fase 3: Estados';
  else if (r.includes('estado futuro') || r.includes('porcentaje de mejora')) phaseBadge.textContent = 'Fase 3: Estados';
  else if (r.includes('por qué') || r.includes('por lo tanto')) phaseBadge.textContent = 'Fase 4: Causa Raíz';
  else if (r.includes('contramedida') || r.includes('acción propones')) phaseBadge.textContent = 'Fase 5: Contramedida';
  else if (r.includes('desperdicio')) phaseBadge.textContent = 'Desperdicios Lean';
}

async function callAPI(text) {
  // Interceptar número de empleado en Fase 1
  if (history.length <= 4 && /^[A-Za-z0-9\-]+$/.test(text.trim()) && text.trim().length <= 15 && !proposalData.COLABORADOR) {
    const colab = await getCollaborator(text.trim().toUpperCase());
    if (colab && colab.nombre) {
      proposalData.EMAIL_COLABORADOR = colab.email_colaborador || '';
      proposalData.EMAIL_SUPERVISOR = colab.email_supervisor || '';
      const contexto = `El sistema encontró al colaborador con número ${text.trim().toUpperCase()}: Nombre: ${colab.nombre}, Área: ${colab.area}, Email colaborador: ${colab.email_colaborador}, Email supervisor: ${colab.email_supervisor}. Confirma estos datos al colaborador y pide el proceso afectado.`;
      history.push({ role: 'user', content: contexto });
    } else {
      history.push({ role: 'user', content: text });
    }
  } else {
    history.push({ role: 'user', content: text });
  }

  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: history, system: SYSTEM_PROMPT })
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error || 'Error de conexión');
  }
  const data = await response.json();
  const reply = data.content;
  history.push({ role: 'assistant', content: reply });
  return reply;
}

async function send(text) {
  if (waiting || !text.trim()) return;
  waiting = true;
  sendBtn.disabled = true;
  addMessage('user', text);
  showTyping();
  try {
    const reply = await callAPI(text);
    hideTyping();
    addMessage('bot', reply);
    updateBadge(reply);
    if (history.length >= 4) btnSave.disabled = false;
  } catch (err) {
    hideTyping();
    addMessage('bot', `⚠️ ${err.message || 'Ocurrió un error. Por favor intenta de nuevo.'}`);
  }
  waiting = false;
  sendBtn.disabled = false;
  userInput.focus();
}

async function saveProposal() {
  const timestamp = new Date().toLocaleString('es-CL');
  const draft = { history: [...history], proposalData: {...proposalData}, proposalReady, currentProposalId, timestamp };
  localStorage.setItem('kaizenbot_draft', JSON.stringify(draft));

  let nombreColab = proposalData.COLABORADOR || '';
  if (!nombreColab && history.length > 0) {
    for (const msg of history) {
      if (msg.role === 'user' && msg.content && msg.content.trim().length > 2 && msg.content.trim().length < 60) {
        nombreColab = msg.content.trim();
        break;
      }
    }
  }

  if (history.length > 2) {
    try {
      const propId = currentProposalId || proposalData.ID || generateProposalId();
      if (!currentProposalId) currentProposalId = propId;
      const record = {
        id_propuesta: propId,
        colaborador: nombreColab || 'Sin nombre',
        area: proposalData.AREA || '',
        proceso: proposalData.PROCESO || '',
        fecha: proposalData.FECHA || getCurrentDate(),
        estado: proposalReady ? 'Enviada' : 'Borrador',
        indicador: proposalData.INDICADOR || '',
        desperdicios: proposalData.DESPERDICIOS || '',
        mejora_estimada: proposalData.MEJORA_ESTIMADA || '',
        propuestas_relacionadas: '',
        conversacion: JSON.stringify(history)
      };
      const response = await fetch('/api/save-proposal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proposal: record })
      });
      if (response.ok) {
        addMessage('bot', `✅ Borrador guardado en el repositorio el ${timestamp} con el número ${propId}. Anótalo para retomarlo desde el menú de inicio.`);
      } else {
        addMessage('bot', `✅ Borrador guardado localmente el ${timestamp}. No se pudo conectar al repositorio en este momento.`);
      }
    } catch(e) {
      addMessage('bot', `✅ Borrador guardado localmente el ${timestamp}.`);
    }
  } else {
    addMessage('bot', `✅ Borrador guardado el ${timestamp}. Puedes cerrar esta ventana y retomarlo más tarde desde el menú de inicio.`);
  }
}

function renderCharts() {
  const d = proposalData;
  const valActual = parseFloat(d.VALOR_ACTUAL_NUM) || 0;
  const estandar = parseFloat(d.ESTANDAR_NUM) || 0;
  const valProyectado = parseFloat(d.VALOR_PROYECTADO_NUM) || 0;
  const unidad = d.UNIDAD || '';

  const ctxActual = document.getElementById('chart-actual');
  if (ctxActual) {
    const brecha = Math.abs(valActual - estandar);
    new Chart(ctxActual, {
      type: 'bar',
      data: {
        labels: ['Valor actual', 'Estándar / Meta', 'Brecha'],
        datasets: [{ data: [valActual, estandar, brecha], backgroundColor: ['#E24B4A', '#534AB7', '#F39C12'], borderRadius: 6, borderSkipped: false }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.parsed.y} ${unidad}` } } },
        scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } }, x: { ticks: { font: { size: 10 } }, grid: { display: false } } }
      }
    });
  }

  const ctxFuturo = document.getElementById('chart-futuro');
  if (ctxFuturo) {
    const brechaFutura = valProyectado - estandar;
    const brechaLabel = brechaFutura >= 0
      ? `▲ Brecha a favor: +${Math.abs(brechaFutura).toFixed(2)} ${unidad}`
      : `▼ Brecha restante: -${Math.abs(brechaFutura).toFixed(2)} ${unidad}`;
    new Chart(ctxFuturo, {
      type: 'bar',
      data: {
        labels: ['Valor proyectado', 'Estándar / Meta'],
        datasets: [{ data: [valProyectado, estandar], backgroundColor: ['#27AE60', '#534AB7'], borderRadius: 6, borderSkipped: false }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.parsed.y} ${unidad}` } } },
        scales: { y: { beginAtZero: true, ticks: { font: { size: 10 } }, grid: { color: '#f0f0f0' } }, x: { ticks: { font: { size: 10 } }, grid: { display: false } } }
      }
    });
    const badgeEl = document.getElementById('brecha-futuro-badge');
    if (badgeEl) {
      badgeEl.textContent = brechaLabel;
      badgeEl.className = `kz-brecha-badge ${brechaFutura >= 0 ? 'kz-brecha-pos' : 'kz-brecha-neg'}`;
    }
  }
}

}

function newProposal() {
  if (history.length > 4 && !confirm('¿Iniciar nueva propuesta? Se perderá la conversación actual si no guardaste un borrador.')) return;
  history = []; proposalData = {}; proposalReady = false; currentProposalId = null;
  btnDownload.disabled = true; btnSave.disabled = true;
  messagesDiv.innerHTML = ''; phaseBadge.textContent = 'Iniciando...';
  init();
}

async function init() {
  const draft = localStorage.getItem('kaizenbot_draft');
  if (draft) {
    try {
      const d = JSON.parse(draft);
      if (confirm(`Tienes un borrador guardado el ${d.timestamp}. ¿Deseas retomarlo?`)) {
        history = d.history; proposalData = d.proposalData || {}; proposalReady = d.proposalReady || false;
        currentProposalId = d.currentProposalId || null;
        if (proposalReady) btnDownload.disabled = false;
        btnSave.disabled = false;
        for (const msg of history) addMessage(msg.role === 'user' ? 'user' : 'bot', msg.content);
        addMessage('bot', '✅ Borrador retomado. Continuemos desde donde lo dejaste.');
        sendBtn.disabled = false;
        return;
      } else { localStorage.removeItem('kaizenbot_draft'); }
    } catch(e) { localStorage.removeItem('kaizenbot_draft'); }
  }

  waiting = true;
  showTyping();
  const fechaHoy = getCurrentDate();
  try {
    const reply = await callAPI(`Inicia la conversación presentándote brevemente como KaizenBot. La fecha de hoy es ${fechaHoy} — úsala automáticamente para los registros sin preguntársela al colaborador. Presenta el menú de inicio con las 3 opciones.`);
    hideTyping();
    addMessage('bot', reply);
    updateBadge(reply);
  } catch(err) {
    hideTyping();
    history = [];
    addMessage('bot', `¡Bienvenido a KaizenBot! Soy tu asistente de mejora continua de ProKaizen Consulting.\n\n¿Qué deseas hacer hoy?\n\n1️⃣ Iniciar una nueva propuesta\n2️⃣ Retomar una propuesta en borrador\n3️⃣ Consultar el estado de una propuesta`);
    phaseBadge.textContent = 'Menú inicio';
  }
  waiting = false;
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', () => {
  const t = userInput.value.trim();
  if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const t = userInput.value.trim();
    if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
});

</script>
