<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>

// ============================================================
// CÓDIGOS DE ACCESO — agregar o eliminar según necesites
// ============================================================
const ACCESS_CODES = [
  "KAIZEN01",
  "KAIZEN02",
  "KAIZEN03",
  "KAIZEN04",
  "KAIZEN05",
  "PROKAIZEN",
  "ORLANDO2025"
];
// ============================================================

// ESTADO GLOBAL
let history = [];
let waiting = false;
let proposalData = {};
let proposalReady = false;
let currentProposalId = null;

const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const phaseBadge = document.getElementById('phase-badge');
const btnSave = document.getElementById('btn-save');
const btnDownload = document.getElementById('btn-download');

// CONTROL DE ACCESO
function checkAccess() {
  const code = document.getElementById('access-input').value.trim().toUpperCase();
  const errorDiv = document.getElementById('access-error');
  if (ACCESS_CODES.includes(code)) {
    document.getElementById('access-screen').style.display = 'none';
    init();
  } else {
    errorDiv.textContent = 'Código incorrecto. Por favor verifica e intenta de nuevo.';
    document.getElementById('access-input').value = '';
    document.getElementById('access-input').focus();
  }
}

document.getElementById('access-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAccess();
});

// GENERADOR DE ID DE PROPUESTA
function generateProposalId() {
  const year = new Date().getFullYear();
  const seq = String(Math.floor(Math.random() * 9000) + 1000);
  return `KT-${year}-${seq}`;
}

// FECHA ACTUAL AUTOMÁTICA
function getCurrentDate() {
  return new Date().toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' });
}

const SYSTEM_PROMPT = `Eres KaizenBot, el asistente digital de mejora continua de ProKaizen Consulting, desarrollado por Orlando Querales, experto en Lean Manufacturing y Kaizen Teian. Tu misión es guiar a colaboradores de empresas para que formulen propuestas de mejora siguiendo estrictamente la metodología Kaizen Teian basada en el ciclo PDCA.

=== PERSONALIDAD Y TONO ===
- Amigable, respetuoso y profesional en todo momento
- Si recibes mensajes fuera de contexto responde: "Disculpa, no comprendo bien lo que me planteas. ¿Podrías contarme sobre el problema que deseas mejorar?"
- NUNCA emitas juicios de valor ni uses lenguaje condescendiente
- NUNCA repitas palabras mal escritas del usuario
- Haz SIEMPRE UNA SOLA pregunta a la vez
- Máximo 3 oraciones por respuesta en fases de recolección
- Responde SIEMPRE en español

=== HERRAMIENTAS PERMITIDAS ===
SOLO: 5 Porqués, Por lo Tanto, ciclo PDCA.
NUNCA menciones: Ishikawa, A3, VSM, VACA, Six Sigma ni ninguna otra herramienta.

=== PALABRAS Y DATOS ===
PALABRAS BASURA SIN NÚMERO (mucho, varios, a veces, bastante, frecuentemente): pedir dato numérico concreto.
APROXIMACIONES CON NÚMERO (entre 20 y 24, aprox 20 minutos): promediar y proponer.
Ejemplo: "¿Te parece si trabajamos con 22 casos como promedio?"

=== MENÚ DE INICIO ===
Al iniciar SIEMPRE presentar este menú antes de cualquier otra cosa:
"¡Bienvenido a KaizenBot! ¿Qué deseas hacer hoy?
1️⃣ Iniciar una nueva propuesta
2️⃣ Retomar una propuesta en borrador
3️⃣ Consultar el estado de una propuesta"

Si elige 2: Preguntar si tiene número KT-AÑO-XXXX. Si no tiene: buscar por nombre, mostrar máximo 5 resultados solo con estado Borrador o En Proceso. Máximo 2 intentos. Si no se encuentra: indicar que puede tener otro estado y ofrecer opción 3.
Si elige 3: Pedir nombre o número de propuesta y mostrar estado.

=== FLUJO — 5 FASES ===

FASE 1 — DATOS ADMINISTRATIVOS:
Solicitar UNO A LA VEZ: nombre completo, área o departamento, proceso afectado.
La fecha actual ya está registrada automáticamente — NUNCA preguntarla al colaborador.
Al completar: confirmar datos y avanzar a Fase 2.

FASE 2 — DEFINICIÓN DEL PROBLEMA:
5 elementos obligatorios: qué ocurre (síntoma), cuándo/frecuencia, dónde, brecha (valor actual vs estándar con datos numéricos), impacto en indicador.

REGLAS CRÍTICAS:
- Si menciona SOLUCIÓN: "Gracias, eso es muy valioso y lo usaremos en la Fase 5. Por ahora centrémonos en describir qué está ocurriendo."
- PALABRAS BASURA SIN NÚMERO: pedir dato concreto.
- APROXIMACIONES CON NÚMERO: promediar y proponer.
- El párrafo NUNCA nombra al colaborador como parte del problema. Tercera persona impersonal.
- Calcular y mencionar la brecha EXPLÍCITAMENTE: valor actual, estándar, diferencia numérica.
- Si el impacto es vago: preguntar valor actual del indicador vs meta.

Al completar los 5 elementos generar párrafo así:
[Cuándo/frecuencia + qué ocurre + dónde + brecha con datos explícitos (valor actual, estándar, diferencia) + impacto en indicador con valor]
En tercera persona impersonal, sin palabras basura, sin causas, sin soluciones.

FASE 3 — ESTADO ACTUAL Y FUTURO:
1. "Describe brevemente cómo ocurre el problema actualmente. Incluye el valor actual del indicador y la brecha con el estándar."
2. "Describe cómo sería la situación una vez resuelta. ¿Qué porcentaje del problema estimas que resolverá tu propuesta?"

FASE 4 — 5 PORQUÉS:
Preguntar: "¿Por qué ocurre [síntoma]?" y encadenar.

PORQUÉS EN PARALELO — cuando el colaborador da varias causas simultáneas al mismo nivel:
NO es un error. Responder: "¡Excelente, [nombre]! Identificaste [N] situaciones importantes que merecen atención. Eso es muy valioso para la mejora continua del área. En la metodología Kaizen Teian cada causa se trabaja por separado para asegurar que la solución sea precisa y efectiva. Continuemos con la primera: [causa elegida por el colaborador]. Las otras las registraré para que puedas desarrollarlas como propuestas independientes."
Registrar internamente las causas paralelas para preconstruir propuestas al final.

DISTRIBUCIÓN PORCENTUAL:
Si hay causas paralelas, preguntar: "¿Qué porcentaje de [la brecha/el problema] estimas que resolvería esta contramedida? Aquí no hay respuesta incorrecta, [nombre] — es solo tu mejor estimación, salvo que tengas los datos precisos para comprobarlo. De cualquier manera, tú junto a tu supervisor podrán ajustarla durante la revisión."

OTRAS REGLAS FASE 4:
- Si responde con sinónimos: pedir profundizar más.
- Si responde con solución: indicar que es solución, no causa.
- La cantidad de porqués no es fija en 5.
- Validar con Por lo Tanto en sentido inverso al final.

FASE 5 — CONTRAMEDIDA:
Preguntar: "¿Qué acción propones para resolver la causa raíz?" — NUNCA sugerir opciones primero.
Validar que apunte a la causa raíz. Preguntar responsable.

PASO FINAL — DESPERDICIOS LEAN:
Antes de generar el documento presentar:
"Antes de finalizar, ¿cuál o cuáles de estos desperdicios Lean eliminaría o reduciría tu propuesta?
1. Sobreproducción — producir más de lo necesario
2. Espera — tiempo inactivo esperando información o decisión
3. Transporte innecesario — movimiento sin valor agregado
4. Sobreprocesamiento — pasos que no agregan valor
5. Inventario excesivo — acumulación de tareas o materiales
6. Movimiento innecesario — desplazamientos sin valor
7. Defectos — errores y reprocesos
8. Talento no aprovechado — habilidades no utilizadas
Puedes indicar uno o varios números."
Confirmar sin juzgar: "Registramos: [selección]. Tu supervisor podrá complementar esto durante la revisión."

PRECONSTRUCCIÓN AL CERRAR:
Si hubo causas paralelas, antes de generar el documento preguntar:
"[Nombre], durante nuestra conversación identificaste [N] situaciones adicionales: [lista]. ¿Deseas iniciar ahora una de estas propuestas o prefieres guardarlas para después?"

DOCUMENTO FINAL — usar EXACTAMENTE este formato:

DOCUMENTO_INICIO
COLABORADOR:[nombre]
AREA:[área]
PROCESO:[proceso]
FECHA:[fecha]
ID:[ID de propuesta]
PROBLEMA:[párrafo del problema]
ESTADO_ACTUAL:[descripción]
ESTADO_FUTURO:[descripción con estimación %]
PORQUES:[porqué 1|porqué 2|porqué 3|porqué 4|porqué 5]
CAUSA_RAIZ:[causa raíz]
CONTRAMEDIDA:[contramedida]
RESPONSABLE:[responsable]
INDICADOR:[indicador afectado]
MEJORA_ESTIMADA:[porcentaje]
DESPERDICIOS:[desperdicio1|desperdicio2]
DOCUMENTO_FIN

Luego preguntar: "¿Deseas ajustar algo antes de descargar tu propuesta?"`;

// MENSAJES
function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'bot' ? '💡' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (content.includes('DOCUMENTO_INICIO') && content.includes('DOCUMENTO_FIN')) {
    parseProposalData(content);
    proposalReady = true;
    btnDownload.disabled = false;
    btnSave.disabled = false;
    phaseBadge.textContent = '✅ Propuesta Lista';
    content = content.substring(0, content.indexOf('DOCUMENTO_INICIO')) +
      '\n\n✅ **¡Tu propuesta Kaizen Teian está completa!** Usa el botón ⬇️ Descargar para verla y guardarla como PDF.\n\n' +
      content.substring(content.indexOf('DOCUMENTO_FIN') + 'DOCUMENTO_FIN'.length);
  }

  bubble.innerHTML = content
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/━+/g, '<hr class="divider">');

  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function parseProposalData(content) {
  const start = content.indexOf('DOCUMENTO_INICIO') + 'DOCUMENTO_INICIO'.length;
  const end = content.indexOf('DOCUMENTO_FIN');
  const raw = content.substring(start, end).trim();
  const lines = raw.split('\n');
  proposalData = {};
  lines.forEach(line => {
    const idx = line.indexOf(':');
    if (idx > -1) {
      const key = line.substring(0, idx).trim();
      const val = line.substring(idx + 1).trim();
      proposalData[key] = val;
    }
  });
  if (!proposalData.ID) proposalData.ID = currentProposalId || generateProposalId();
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = '💡';
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function updateBadge(reply) {
  if (proposalReady) return;
  const r = reply.toLowerCase();
  if (r.includes('nueva propuesta') || r.includes('retomar') || r.includes('consultar')) phaseBadge.textContent = 'Menú inicio';
  else if (r.includes('nombre') && history.length < 6) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('área') || r.includes('proceso afectado')) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('problema') || r.includes('estándar') || r.includes('brecha')) phaseBadge.textContent = 'Fase 2: Problema';
  else if (r.includes('estado actual') || r.includes('ocurre actualmente')) phaseBadge.textContent = 'Fase 3: Estados';
  else if (r.includes('por qué') || r.includes('por lo tanto')) phaseBadge.textContent = 'Fase 4: Causa Raíz';
  else if (r.includes('contramedida') || r.includes('acción propones')) phaseBadge.textContent = 'Fase 5: Contramedida';
  else if (r.includes('desperdicio')) phaseBadge.textContent = 'Desperdicios Lean';
}

async function callAPI(text) {
  history.push({ role: 'user', content: text });
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: history, system: SYSTEM_PROMPT })
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error || 'Error de conexión');
  }
  const data = await response.json();
  const reply = data.content;
  history.push({ role: 'assistant', content: reply });
  return reply;
}

async function send(text) {
  if (waiting || !text.trim()) return;
  waiting = true;
  sendBtn.disabled = true;
  addMessage('user', text);
  showTyping();
  try {
    const reply = await callAPI(text);
    hideTyping();
    addMessage('bot', reply);
    updateBadge(reply);
    if (history.length >= 4) btnSave.disabled = false;
  } catch (err) {
    hideTyping();
    addMessage('bot', `⚠️ ${err.message || 'Ocurrió un error. Por favor intenta de nuevo.'}`);
  }
  waiting = false;
  sendBtn.disabled = false;
  userInput.focus();
}

// GUARDAR BORRADOR — local + Supabase
async function saveProposal() {
  const timestamp = new Date().toLocaleString('es-CL');
  const draft = {
    history: [...history],
    proposalData: {...proposalData},
    proposalReady,
    currentProposalId,
    timestamp
  };
  localStorage.setItem('kaizenbot_draft', JSON.stringify(draft));

  // Extraer nombre del colaborador del historial si no está en proposalData
  let nombreColab = proposalData.COLABORADOR || '';
  if (!nombreColab && history.length > 0) {
    for (const msg of history) {
      if (msg.role === 'user' && msg.content && msg.content.trim().length > 2 && msg.content.trim().length < 60) {
        nombreColab = msg.content.trim();
        break;
      }
    }
  }

  // Guardar en Supabase siempre que haya al menos un mensaje
  if (history.length > 2) {
    try {
      const propId = currentProposalId || proposalData.ID || generateProposalId();
      if (!currentProposalId) currentProposalId = propId;

      const record = {
        id_propuesta: propId,
        colaborador: nombreColab || 'Sin nombre',
        area: proposalData.AREA || '',
        proceso: proposalData.PROCESO || '',
        fecha: proposalData.FECHA || getCurrentDate(),
        estado: proposalReady ? 'Enviada' : 'Borrador',
        indicador: proposalData.INDICADOR || '',
        desperdicios: proposalData.DESPERDICIOS || '',
        mejora_estimada: proposalData.MEJORA_ESTIMADA || '',
        propuestas_relacionadas: '',
        conversacion: JSON.stringify(history)
      };

      const response = await fetch('/api/save-proposal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proposal: record })
      });

      if (response.ok) {
        addMessage('bot', `✅ Borrador guardado en el repositorio el ${timestamp} con el número ${propId}. Anótalo para retomarlo desde el menú de inicio.`);
      } else {
        addMessage('bot', `✅ Borrador guardado localmente el ${timestamp}. No se pudo conectar al repositorio en este momento.`);
      }
    } catch(e) {
      addMessage('bot', `✅ Borrador guardado localmente el ${timestamp}.`);
    }
  } else {
    addMessage('bot', `✅ Borrador guardado el ${timestamp}. Puedes cerrar esta ventana y retomarlo más tarde desde el menú de inicio.`);
  }
}

// NUEVA PROPUESTA
function newProposal() {
  if (history.length > 4 && !confirm('¿Iniciar nueva propuesta? Se perderá la conversación actual si no guardaste un borrador.')) return;
  history = []; proposalData = {}; proposalReady = false; currentProposalId = null;
  btnDownload.disabled = true; btnSave.disabled = true;
  messagesDiv.innerHTML = ''; phaseBadge.textContent = 'Iniciando...';
  init();
}

// INICIALIZACIÓN
async function init() {
  const draft = localStorage.getItem('kaizenbot_draft');
  if (draft) {
    try {
      const d = JSON.parse(draft);
      if (confirm(`Tienes un borrador guardado el ${d.timestamp}. ¿Deseas retomarlo?`)) {
        history = d.history; proposalData = d.proposalData || {}; proposalReady = d.proposalReady || false;
        currentProposalId = d.currentProposalId || null;
        if (proposalReady) btnDownload.disabled = false;
        btnSave.disabled = false;
        for (const msg of history) addMessage(msg.role === 'user' ? 'user' : 'bot', msg.content);
        addMessage('bot', '✅ Borrador retomado. Continuemos desde donde lo dejaste.');
        sendBtn.disabled = false;
        return;
      } else { localStorage.removeItem('kaizenbot_draft'); }
    } catch(e) { localStorage.removeItem('kaizenbot_draft'); }
  }

  waiting = true;
  showTyping();
  const fechaHoy = getCurrentDate();
  try {
    const reply = await callAPI(`Inicia la conversación presentándote brevemente como KaizenBot. La fecha de hoy es ${fechaHoy} — úsala automáticamente para los registros sin preguntársela al colaborador. Presenta el menú de inicio con las 3 opciones.`);
    hideTyping();
    addMessage('bot', reply);
    updateBadge(reply);
  } catch(err) {
    hideTyping();
    history = [];
    addMessage('bot', `¡Bienvenido a KaizenBot! Soy tu asistente de mejora continua de ProKaizen Consulting.\n\n¿Qué deseas hacer hoy?\n\n1️⃣ Iniciar una nueva propuesta\n2️⃣ Retomar una propuesta en borrador\n3️⃣ Consultar el estado de una propuesta`);
    phaseBadge.textContent = 'Menú inicio';
  }
  waiting = false;
  sendBtn.disabled = false;
}

// EVENTOS
sendBtn.addEventListener('click', () => {
  const t = userInput.value.trim();
  if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const t = userInput.value.trim();
    if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
});
