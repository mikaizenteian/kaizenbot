<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaizenBot - Asistente de Mejora Continua</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #EEEDFE;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 720px;
    height: 92vh;
    max-height: 800px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(83,74,183,0.15);
  }

  /* HEADER */
  #header {
    padding: 16px 20px;
    background: #534AB7;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #header .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  #header .info .name { font-size: 16px; font-weight: 700; color: #fff; }
  #header .info .status { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }
  #phase-badge {
    margin-left: auto;
    font-size: 11px; font-weight: 600;
    padding: 5px 14px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* MESSAGES */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #f7f8fc;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #d0cef5; border-radius: 4px; }

  .msg { display: flex; gap: 8px; max-width: 88%; }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.7;
  }
  .msg.bot .bubble {
    background: #fff;
    color: #1a1a2e;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .msg.user .bubble {
    background: #534AB7;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg .av {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; margin-top: 2px;
  }
  .msg.bot .av { background: #EEEDFE; }
  .msg.user .av { background: #e8f5e9; }

  /* TYPING */
  .typing-bubble {
    display: flex; gap: 5px;
    padding: 14px 16px;
    align-items: center;
    background: #fff;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .typing-bubble span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #c5c2f0;
    animation: bounce 1.2s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-7px); }
  }

  /* ACTIONS BAR */
  #actions-bar {
    padding: 8px 16px;
    background: #fff;
    border-top: 1px solid #f0f0f0;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .action-btn {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid #534AB7;
    color: #534AB7;
    background: #fff;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 5px;
  }
  .action-btn:hover { background: #EEEDFE; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn.primary { background: #534AB7; color: #fff; }
  .action-btn.primary:hover { background: #3C3489; }

  /* INPUT */
  #input-area {
    padding: 14px 16px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: #fff;
    flex-shrink: 0;
  }
  #user-input {
    flex: 1;
    resize: none;
    border: 1.5px solid #e0e0e0;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    color: #1a1a2e;
    background: #fff;
    min-height: 44px;
    max-height: 110px;
    outline: none;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #user-input:focus { border-color: #534AB7; }
  #user-input::placeholder { color: #aaa; }

  #send-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: #534AB7;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  #send-btn:hover { background: #3C3489; }
  #send-btn:disabled { background: #ccc; cursor: not-allowed; }
  #send-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* BRANDING */
  #branding {
    text-align: center;
    padding: 7px;
    font-size: 11px;
    color: #aaa;
    background: #fff;
    border-top: 1px solid #f5f5f5;
    flex-shrink: 0;
  }
  #branding a { color: #534AB7; text-decoration: none; }

  /* DOCUMENT PREVIEW */
  #doc-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #doc-modal.open { display: flex; }
  #doc-box {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 650px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  #doc-header {
    padding: 16px 20px;
    background: #534AB7;
    border-radius: 16px 16px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #doc-header span { color: #fff; font-weight: 700; font-size: 15px; }
  #doc-close {
    background: rgba(255,255,255,0.2);
    border: none; color: #fff;
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  #doc-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    font-size: 13px;
    line-height: 1.8;
    color: #1a1a2e;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
  }
  #doc-footer {
    padding: 14px 20px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  hr.divider { border: none; border-top: 1px solid #eee; margin: 6px 0; }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div class="avatar">💡</div>
    <div class="info">
      <div class="name">KaizenBot</div>
      <div class="status">Asistente de mejora continua · ProKaizen Consulting</div>
    </div>
    <div id="phase-badge">Iniciando...</div>
  </div>

  <div id="messages"></div>

  <div id="actions-bar">
    <button class="action-btn" id="btn-save" disabled onclick="saveProposal()" title="Guardar borrador">
      💾 Guardar borrador
    </button>
    <button class="action-btn" id="btn-download" disabled onclick="downloadProposal()" title="Descargar propuesta">
      ⬇️ Descargar
    </button>
    <button class="action-btn" id="btn-new" onclick="newProposal()" title="Nueva propuesta">
      ✚ Nueva propuesta
    </button>
  </div>

  <div id="input-area">
    <textarea id="user-input" placeholder="Escribe tu mensaje aquí..." rows="1"></textarea>
    <button id="send-btn" disabled>
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <div id="branding">
    Desarrollado por <a href="#" target="_blank">ProKaizen Consulting</a> · Metodología Kaizen Teian · Orlando Querales
  </div>
</div>

<!-- MODAL DOCUMENTO -->
<div id="doc-modal">
  <div id="doc-box">
    <div id="doc-header">
      <span>📋 Propuesta Kaizen Teian</span>
      <button id="doc-close" onclick="closeDocModal()">✕</button>
    </div>
    <div id="doc-content"></div>
    <div id="doc-footer">
      <button class="action-btn" onclick="closeDocModal()">Cerrar</button>
      <button class="action-btn primary" onclick="downloadTxt()">⬇️ Descargar .txt</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIGURACIÓN — PEGA TU API KEY DE ANTHROPIC AQUÍ ABAJO
// ============================================================
const API_KEY = "";
// ============================================================

const API_URL = "https://api.anthropic.com/v1/messages";
const MODEL = "claude-sonnet-4-6";

const SYSTEM_PROMPT = `Eres KaizenBot, el asistente digital de mejora continua de ProKaizen Consulting, desarrollado por Orlando Querales, experto en Lean Manufacturing y Kaizen Teian. Tu misión es guiar a colaboradores de empresas para que formulen propuestas de mejora siguiendo estrictamente la metodología Kaizen Teian basada en el ciclo PDCA.

=== PERSONALIDAD Y TONO ===
- Amigable, respetuoso y profesional en todo momento
- Si recibes mensajes fuera de contexto, bromas o comentarios no pertinentes, responde amablemente: "Disculpa, no comprendo bien lo que me planteas. ¿Podrías contarme sobre el problema o situación que deseas mejorar en tu trabajo?"
- NUNCA emitas juicios de valor, califiques situaciones, uses adjetivos innecesarios ni induzcas respuestas
- NUNCA repitas palabras mal escritas del usuario
- NUNCA uses palabras ofensivas ni condescendientes
- Haz SIEMPRE UNA SOLA pregunta a la vez, nunca varias juntas
- Pregunta primero, explica solo si es necesario o si comete un error metodológico
- Máximo 3 oraciones por respuesta en fases de recolección de datos
- Responde SIEMPRE en español

=== HERRAMIENTAS PERMITIDAS ===
SOLO puedes mencionar y aplicar estas técnicas: 5 Porqués, Por lo Tanto, ciclo PDCA.
NUNCA menciones: Ishikawa, diagrama de espina de pescado, A3, VSM, VACA, Six Sigma, ni ninguna otra herramienta fuera de las tres mencionadas.

=== PALABRAS BASURA - DETECTAR Y CORREGIR ===
Si el usuario usa palabras vagas como: mucho, varios, a veces, bastante, lotes, montones, innumerables, demasiados, escasos, pocos, significativo, grande, pequeño (sin datos), frecuentemente, raramente, casi siempre, casi nunca...
Responde: "Para describir bien el problema necesitamos datos medibles. ¿Podrías indicarme un número o porcentaje concreto?"

=== FLUJO COMPLETO DEL PROCESO ===
El proceso tiene 5 fases. Sigue este orden estrictamente.

--- FASE 1: DATOS ADMINISTRATIVOS ---
Solicita en orden, uno a la vez:
1. Nombre completo del colaborador
2. Área o departamento
3. Proceso afectado
4. Fecha (usa la actual si no la indica)
Luego avanza a Fase 2.

--- FASE 2: DEFINICIÓN DEL PROBLEMA ---
Objetivo: construir un párrafo que responda estos 5 elementos obligatorios:
1. QUÉ ocurre (síntoma, NO causa ni solución)
2. CUÁNDO ocurre o con qué frecuencia
3. DÓNDE ocurre (proceso, área o referencia)
4. BRECHA: valor actual vs estándar o situación ideal (con datos numéricos)
5. IMPACTO: qué objetivo, indicador, meta, SLA o resultado se ve afectado

REGLAS CRÍTICAS FASE 2:
- Si menciona una SOLUCIÓN: guardarla internamente y redirigir amablemente al síntoma
- Si no hay estándar formal: aceptar situación ideal como referencia provisional
- Si usa palabras basura: pedir dato numérico concreto
- El problema es la brecha entre el estándar y el valor actual
- Si describe varios problemas: separar en Kaizenes individuales
- Al completar los 5 elementos: generar párrafo en tercera persona y pedir validación

Formato del párrafo: Cuándo/frecuencia + qué ocurre + dónde + brecha con datos + impacto en indicador/objetivo. Sin palabras basura, sin causas, sin soluciones, en tercera persona.

--- FASE 3: ESTADO ACTUAL Y ESTADO FUTURO ---
Solicita al colaborador:
1. "Describe brevemente cómo ocurre el problema actualmente. Incluye el valor actual del indicador afectado y la brecha con respecto al estándar."
2. "Describe cómo sería la situación una vez resuelta. ¿Qué porcentaje del problema estimas que resolverá tu propuesta?"

--- FASE 4: ANÁLISIS DE CAUSA RAÍZ - 5 PORQUÉS ---
Aplica la técnica directamente sin anunciarla. Pregunta: "¿Por qué ocurre [síntoma]?"
Por cada respuesta: "¿Y por qué [respuesta anterior]?"

REGLAS CRÍTICAS FASE 4:
- Cada porqué se basa SIEMPRE en la respuesta anterior, nunca en paralelo
- Si da múltiples causas: pedir que elija una
- Si responde con sinónimos: pedir profundizar más
- Si responde con una solución: indicar que es una solución, no una causa
- La causa raíz se alcanza cuando no se puede continuar con coherencia

Tras los porqués, aplica los POR LO TANTO en sentido inverso para validar la coherencia.
Si hay inconsistencia: revisar el paso donde se detectó.

--- FASE 5: CONTRAMEDIDA ---
Pregunta: "¿Qué acción propones para resolver la causa raíz?"
NUNCA sugieras opciones primero.
Valida que apunte a la causa raíz, no al síntoma.
Pregunta si la acción está dentro de sus posibilidades.
Pregunta quién sería el responsable.

--- DOCUMENTO FINAL ---
Cuando todas las fases estén completas, genera el documento con este formato EXACTO (es importante para la descarga):

DOCUMENTO_INICIO
📋 PROPUESTA DE MEJORA - KAIZEN TEIAN
ProKaizen Consulting · Orlando Querales
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

👤 DATOS ADMINISTRATIVOS
Colaborador: [nombre]
Área: [área]
Proceso: [proceso]
Fecha: [fecha]

🔴 PROBLEMA
[párrafo validado]

📊 ESTADO ACTUAL
[descripción estado actual con datos]

🟢 ESTADO FUTURO
[descripción estado futuro con estimación]

🔍 ANÁLISIS DE CAUSA RAÍZ
Por qué 1: [respuesta 1]
Por qué 2: [respuesta 2]
Por qué 3: [respuesta 3]
Por qué 4: [respuesta 4]
Por qué 5: [respuesta 5]

✅ CAUSA RAÍZ IDENTIFICADA
[último porqué]

💡 CONTRAMEDIDA PROPUESTA
[contramedida]
Responsable: [responsable]

🎯 BENEFICIOS ESPERADOS
Impacto en indicador: [indicador]
Estimación de mejora: [porcentaje estimado]

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Generado con KaizenBot · ProKaizen Consulting
DOCUMENTO_FIN

Luego pregunta: "¿Deseas ajustar algo antes de descargar esta propuesta?"`;

let history = [];
let waiting = false;
let proposalDoc = "";
let proposalReady = false;
let savedDraft = null;

const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const phaseBadge = document.getElementById('phase-badge');
const btnSave = document.getElementById('btn-save');
const btnDownload = document.getElementById('btn-download');

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'bot' ? '💡' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  // Extraer documento si existe
  if (content.includes('DOCUMENTO_INICIO') && content.includes('DOCUMENTO_FIN')) {
    const start = content.indexOf('DOCUMENTO_INICIO') + 'DOCUMENTO_INICIO'.length;
    const end = content.indexOf('DOCUMENTO_FIN');
    proposalDoc = content.substring(start, end).trim();
    proposalReady = true;
    btnDownload.disabled = false;
    btnSave.disabled = false;

    // Mostrar versión limpia en el chat
    const before = content.substring(0, content.indexOf('DOCUMENTO_INICIO'));
    const after = content.substring(content.indexOf('DOCUMENTO_FIN') + 'DOCUMENTO_FIN'.length);
    content = before + '\n\n✅ **Tu propuesta Kaizen Teian está lista.** Puedes descargarla con el botón ⬇️ Descargar.\n\n' + after;
  }

  bubble.innerHTML = content
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/━+/g, '<hr class="divider">');

  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing-indicator';
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = '💡';
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function updateBadge(reply) {
  const r = reply.toLowerCase();
  if (r.includes('nombre') && history.length < 4) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('área') || r.includes('proceso afectado')) phaseBadge.textContent = 'Fase 1: Datos';
  else if (r.includes('problema') || r.includes('qué ocurre') || r.includes('estándar') || r.includes('brecha')) phaseBadge.textContent = 'Fase 2: Problema';
  else if (r.includes('estado actual') || r.includes('estado futuro') || r.includes('ocurre actualmente')) phaseBadge.textContent = 'Fase 3: Estados';
  else if (r.includes('por qué') || r.includes('porqué') || r.includes('por lo tanto')) phaseBadge.textContent = 'Fase 4: Causa Raíz';
  else if (r.includes('contramedida') || r.includes('acción propones') || r.includes('causa raíz identificada')) phaseBadge.textContent = 'Fase 5: Contramedida';
  else if (proposalReady) phaseBadge.textContent = '✅ Propuesta Lista';
}

async function callAPI(text) {
  history.push({ role: 'user', content: text });

  const response = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-request-bypass': 'true'
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: history
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || 'Error de conexión con la API');
  }

  const data = await response.json();
  const reply = data.content[0].text;
  history.push({ role: 'assistant', content: reply });
  return reply;
}

async function send(text) {
  if (waiting || !text.trim()) return;
  waiting = true;
  sendBtn.disabled = true;
  addMessage('user', text);
  showTyping();

  try {
    const reply = await callAPI(text);
    hideTyping();
    addMessage('bot', reply);
    updateBadge(reply);
    btnSave.disabled = history.length < 2;
  } catch (err) {
    hideTyping();
    addMessage('bot', `⚠️ ${err.message || 'Ocurrió un error. Por favor intenta de nuevo.'}`);
  }

  waiting = false;
  sendBtn.disabled = false;
  userInput.focus();
}

function saveProposal() {
  savedDraft = {
    history: [...history],
    proposalDoc,
    proposalReady,
    timestamp: new Date().toLocaleString('es-CL')
  };
  localStorage.setItem('kaizenbot_draft', JSON.stringify(savedDraft));
  addMessage('bot', `✅ Borrador guardado el ${savedDraft.timestamp}. Puedes cerrar esta ventana y retomar más tarde.`);
}

function downloadProposal() {
  if (!proposalDoc) {
    addMessage('bot', 'La propuesta aún no está completa. Continuemos hasta terminar todas las fases.');
    return;
  }
  document.getElementById('doc-content').textContent = proposalDoc;
  document.getElementById('doc-modal').classList.add('open');
}

function closeDocModal() {
  document.getElementById('doc-modal').classList.remove('open');
}

function downloadTxt() {
  const blob = new Blob([proposalDoc], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const colabName = proposalDoc.match(/Colaborador:\s*(.+)/)?.[1]?.trim().replace(/\s+/g, '_') || 'propuesta';
  const fecha = new Date().toISOString().split('T')[0];
  a.download = `KaizenTeian_${colabName}_${fecha}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function newProposal() {
  if (history.length > 2 && !confirm('¿Deseas iniciar una nueva propuesta? Se perderá la conversación actual si no guardaste un borrador.')) return;
  history = [];
  proposalDoc = '';
  proposalReady = false;
  btnDownload.disabled = true;
  btnSave.disabled = true;
  messagesDiv.innerHTML = '';
  phaseBadge.textContent = 'Iniciando...';
  init();
}

async function init() {
  // Verificar si hay borrador guardado
  const draft = localStorage.getItem('kaizenbot_draft');
  if (draft) {
    try {
      const d = JSON.parse(draft);
      if (confirm(`Tienes un borrador guardado el ${d.timestamp}. ¿Deseas retomarlo?`)) {
        history = d.history;
        proposalDoc = d.proposalDoc || '';
        proposalReady = d.proposalReady || false;
        if (proposalReady) { btnDownload.disabled = false; }
        btnSave.disabled = false;

        // Reconstruir mensajes
        for (const msg of history) {
          addMessage(msg.role === 'user' ? 'user' : 'bot', msg.content);
        }
        addMessage('bot', '✅ Borrador retomado. Continuemos desde donde lo dejaste.');
        sendBtn.disabled = false;
        return;
      } else {
        localStorage.removeItem('kaizenbot_draft');
      }
    } catch(e) {
      localStorage.removeItem('kaizenbot_draft');
    }
  }

  // Inicio normal
  waiting = true;
  showTyping();
  try {
    const reply = await callAPI('Inicia la conversación. Preséntate brevemente como KaizenBot de ProKaizen Consulting, explica en una oración tu propósito y solicita el nombre completo del colaborador para comenzar.');
    hideTyping();
    addMessage('bot', reply);
    updateBadge(reply);
  } catch(err) {
    hideTyping();
    history = [];
    addMessage('bot', '¡Hola! Soy KaizenBot, el asistente de mejora continua de ProKaizen Consulting.\n\nEstoy aquí para guiarte en la elaboración de una propuesta de mejora siguiendo la metodología Kaizen Teian.\n\n¿Cuál es tu nombre completo para comenzar?');
    phaseBadge.textContent = 'Fase 1: Datos';
  }
  waiting = false;
  sendBtn.disabled = false;
}

// EVENTOS
sendBtn.addEventListener('click', () => {
  const t = userInput.value.trim();
  if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const t = userInput.value.trim();
    if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
});

// Verificar API key
if (API_KEY === "PEGA_TU_API_KEY_AQUI") {
  setTimeout(() => {
    addMessage('bot', '⚠️ **Configuración pendiente:** Por favor abre el archivo index.html y reemplaza PEGA_TU_API_KEY_AQUI con tu API key de Anthropic.');
    sendBtn.disabled = true;
  }, 500);
} else {
  init();
}
</script>
</body>
</html>
