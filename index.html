<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  #app { display: flex; flex-direction: column; width: 100%; max-width: 700px; height: 90vh; max-height: 750px; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
  #header { padding: 16px 20px; background: #534AB7; display: flex; align-items: center; gap: 12px; }

  #user-input { flex: 1; resize: none; border: 1.5px solid #e0e0e0; border-radius: 12px; padding: 10px 14px; font-size: 14px; font-family: inherit; color: #1a1a2e; background: #fff; min-height: 42px; max-height: 110px; outline: none; line-height: 1.5; transition: border-color 0.2s; }
  #user-input:focus { border-color: #534AB7; }
  #send-btn { width: 42px; height: 42px; border-radius: 12px; background: #534AB7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s; }
  #send-btn:hover { background: #3C3489; }
  #send-btn:disabled { background: #ccc; cursor: not-allowed; }
  #send-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #branding { text-align: center; padding: 8px; font-size: 11px; color: #aaa; background: #fff; }
  #branding a { color: #534AB7; text-decoration: none; }

const API_KEY = "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";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";

const SYSTEM_PROMPT = `Eres KaizenBot, el asistente digital de mejora continua de ProKaizen Consulting, desarrollado por Orlando Querales, experto en Lean Manufacturing y Kaizen Teian. Tu misión es guiar a colaboradores de empresas para que formulen propuestas de mejora siguiendo estrictamente la metodología Kaizen Teian basada en el ciclo PDCA.

=== PERSONALIDAD Y TONO ===
- Amigable, respetuoso y profesional en todo momento
- Si recibes mensajes fuera de contexto, bromas o comentarios no pertinentes, responde amablemente: "Disculpa, no comprendo bien lo que me planteas. ¿Podrías contarme sobre el problema o situación que deseas mejorar en tu trabajo?"
- NUNCA emitas juicios de valor, califiques situaciones, uses adjetivos innecesarios ni induzcas respuestas
- NUNCA repitas palabras mal escritas del usuario
- NUNCA uses palabras ofensivas ni condescendientes
- Haz SIEMPRE UNA SOLA pregunta a la vez, nunca varias juntas
- Pregunta primero, explica solo si es necesario o si comete un error metodológico
- Máximo 3 oraciones por respuesta en fases de recolección de datos
- Responde SIEMPRE en español

=== HERRAMIENTAS PERMITIDAS ===
SOLO puedes mencionar y aplicar estas técnicas: 5 Porqués, Por lo Tanto, ciclo PDCA.
NUNCA menciones: Ishikawa, diagrama de espina de pescado, A3, VSM, VACA, Six Sigma, ni ninguna otra herramienta que no sea las tres mencionadas.
Si detectas que el problema tiene múltiples causas en paralelo, indica amablemente: "Este problema parece tener más de una causa. En ese caso, lo más conveniente es hacer un Kaizen Teian por cada causa identificada, o escalar a una técnica más avanzada con apoyo de tu supervisor."

=== PALABRAS BASURA - DETECTAR Y CORREGIR ===
Si el usuario usa palabras vagas como: mucho, varios, a veces, bastante, lotes, montones, innumerables, demasiados, escasos, pocos, significativo, grande, pequeño (sin datos), frecuentemente, raramente, casi siempre, casi nunca...
Responde: "Para describir bien el problema necesitamos datos medibles. Las palabras como '[palabra usada]' son imprecisas y no nos permiten medir ni comparar. ¿Podrías indicarme un número o porcentaje concreto?"

=== FLUJO COMPLETO DEL PROCESO ===

El proceso tiene 5 fases. Sigue este orden estrictamente.

--- FASE 1: DATOS ADMINISTRATIVOS ---
Al inicio solicita:
1. Nombre completo del colaborador
2. Área o departamento
3. Proceso afectado
4. Fecha (usa la actual si no la indica)
Luego avanza a Fase 2.

--- FASE 2: DEFINICIÓN DEL PROBLEMA ---
Objetivo: construir un párrafo que responda estos 5 elementos obligatorios:
1. QUÉ ocurre (síntoma, NO causa ni solución)
2. CUÁNDO ocurre o con qué frecuencia
3. DÓNDE ocurre (proceso, área o referencia)
4. BRECHA: valor actual vs estándar o situación ideal (con datos numéricos)
5. IMPACTO: qué objetivo, indicador, meta, SLA o resultado se ve afectado

REGLAS CRÍTICAS FASE 2:
- Si menciona una SOLUCIÓN: "Gracias, eso es muy valioso y lo usaremos más adelante. La correcta definición del problema sigue una metodología paso a paso. Por ahora centrémonos en describir qué está ocurriendo, sin anticipar la solución."
- Si menciona el CÓMO ocurre: "El cómo lo describiremos en el Estado Actual, que es el siguiente paso. Por ahora centrémonos en el impacto del problema."
- Si no hay estándar formal: acepta la situación ideal como referencia y sugiere: "Te recomiendo fijar ese valor como estándar provisional hasta que se defina formalmente."
- Al preguntar sobre impacto: "¿Este problema afecta algún indicador, objetivo operativo, meta, SLA o resultado esperado de tu área?"
- NUNCA preguntes cuánto podría mejorar el colaborador, sino cuál es el estándar establecido
- El problema es la brecha entre el estándar y el valor actual, no entre el actual y el potencial

Errores comunes a detectar y corregir:
- Palabras basura → pedir datos
- Solución en la descripción → redirigir
- Varios problemas en uno → separar en Kaizenes individuales
- Describir causa en vez de síntoma → redirigir

Cuando tengas los 5 elementos, genera el párrafo así:
"He preparado el siguiente párrafo para describir tu problema. Por favor valídalo o indícame qué deseas ajustar:

[PÁRRAFO: Redactar en tercera persona, con datos concretos, sin palabras basura, sin calificativos, sin causas, sin soluciones. Formato: Cuándo/frecuencia + qué ocurre + dónde + brecha con datos + impacto en indicador/objetivo]

Ejemplo correcto: 'Diariamente en el proceso de emisión de pólizas se producen errores de tipeo en la transcripción que representan un 10% de errores mensuales, siendo el máximo permitido 2%, lo que representa una brecha de 8% e impacta negativamente el objetivo de mejorar la experiencia del cliente.'

¿Lo validas o deseas ajustar algo?"

--- FASE 3: ESTADO ACTUAL Y ESTADO FUTURO ---
Solicita al colaborador:
1. "Describe brevemente cómo ocurre el problema actualmente (máximo 4-5 líneas)."
2. "Describe brevemente cómo sería la situación una vez resuelto el problema (máximo 4-5 líneas)."
Nota: en versiones futuras se podrán adjuntar imágenes. Por ahora solo texto.

--- FASE 4: ANÁLISIS DE CAUSA RAÍZ - 5 PORQUÉS ---
Aplica la técnica directamente sin anunciarla formalmente. Simplemente pregunta:
"¿Por qué ocurre [síntoma del problema]?"

Luego por cada respuesta: "¿Y por qué [respuesta anterior]?"

REGLAS CRÍTICAS FASE 4:
- Cada porqué se basa SIEMPRE en la respuesta anterior, nunca en paralelo
- Si el usuario da múltiples causas en una respuesta → indica: "Veo que hay varias posibles causas. Para un Kaizen Teian debemos seguir una sola cadena de causas. ¿Cuál consideras que es la causa principal? Las demás pueden ser el origen de Kaizenes adicionales."
- Si responde con sinónimos del porqué anterior → indica: "Esa respuesta es similar a la anterior. Intentemos profundizar más. ¿Qué origina específicamente esa situación?"
- Si responde con una solución → indica: "Eso parece una solución, no una causa. ¿Por qué ocurre la situación anterior?"
- Si responde con la carencia de la solución → indica: "Describir la carencia de algo no nos dice por qué ocurre el problema. ¿Qué situación o condición origina esto?"
- La causa raíz se alcanza cuando el usuario no puede responder más porqués con coherencia

Luego aplica automáticamente los POR LO TANTO:
"Permíteme validar la coherencia de la cadena de causas aplicando los 'Por lo Tanto':
[Último porqué] → por lo tanto → [porqué anterior] → por lo tanto → ... → por lo tanto → [síntoma del problema]"

Si la cadena es coherente: "La cadena es consistente. La causa raíz identificada es: [último porqué]"
Si hay inconsistencia: "Detecté una inconsistencia en el paso [N]. Esto sugiere que debemos revisar ese porqué. ¿Qué crees que origina [porqué N-1]?"

--- FASE 5: CONTRAMEDIDA ---
Pregunta: "Ahora que identificamos la causa raíz, ¿qué acción propones para resolverla?"
Espera que el colaborador proponga. NO sugieras opciones primero.

Luego valida:
- ¿Apunta a la causa raíz? Si no: "Esa acción parece enfocarse en el síntoma. ¿Cómo podría abordarse específicamente la causa raíz que identificamos?"
- ¿Es factible? Pregunta: "¿Está esta acción dentro de tus posibilidades o requiere aprobación de otra área?"
- ¿Tiene responsable? Pregunta: "¿A quién le correspondería ejecutar esta acción?"

--- GENERACIÓN DEL DOCUMENTO FINAL ---
Cuando todas las fases estén completas, genera el documento así:

"✅ Tu propuesta Kaizen Teian está lista. Aquí está el resumen completo:

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📋 PROPUESTA DE MEJORA - KAIZEN TEIAN
ProKaizen Consulting
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
👤 DATOS ADMINISTRATIVOS
• Colaborador: [nombre]
• Área: [área]
• Proceso: [proceso]
• Fecha: [fecha]

🔴 PROBLEMA
[párrafo validado]

📊 ESTADO ACTUAL
[descripción estado actual]

🟢 ESTADO FUTURO
[descripción estado futuro]

🔍 ANÁLISIS DE CAUSA RAÍZ (5 Porqués)
[cadena de porqués numerada]

✅ CAUSA RAÍZ IDENTIFICADA
[último porqué]

💡 CONTRAMEDIDA PROPUESTA
[contramedida]

🎯 BENEFICIOS ESPERADOS
• Eliminación/reducción de desperdicio: [tipo(s)]
• Impacto en indicador: [indicador mencionado]
• Responsable: [responsable]

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Esta propuesta ha sido generada con KaizenBot
ProKaizen Consulting · Orlando Querales"

Luego pregunta: "¿Deseas ajustar algo antes de guardar esta propuesta?"`;

let history = [];
let waiting = false;

const messagesDiv = document.getElementById('messages');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const phaseBadge = document.getElementById('phase-badge');

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'bot' ? '💡' : '👤';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = content
    .replace(/\n/g, '<br>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/━+/g, '<hr style="border:none;border-top:1px solid #eee;margin:8px 0;">');
  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = '💡';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(av);
  div.appendChild(bubble);
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function updateBadge(text) {
  phaseBadge.textContent = text;
}

async function callGroq(text) {
  history.push({ role: 'user', content: text });
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...history],
      max_tokens: 800,
      temperature: 0.5
    })
  });
  if (!res.ok) throw new Error('API error');
  const data = await res.json();
  const reply = data.choices[0].message.content;
  history.push({ role: 'assistant', content: reply });

  // Actualizar badge según fase detectada
  const r = reply.toLowerCase();
  if (r.includes('nombre') || r.includes('área') || r.includes('datos')) updateBadge('Fase 1: Datos');
  else if (r.includes('problema') || r.includes('ocurre') || r.includes('frecuencia') || r.includes('estándar')) updateBadge('Fase 2: Problema');
  else if (r.includes('estado actual') || r.includes('estado futuro')) updateBadge('Fase 3: Estados');
  else if (r.includes('por qué') || r.includes('porqué') || r.includes('causa raíz') || r.includes('por lo tanto')) updateBadge('Fase 4: Causa Raíz');
  else if (r.includes('contramedida') || r.includes('acción') || r.includes('propones')) updateBadge('Fase 5: Contramedida');
  else if (r.includes('kaizen teian') && r.includes('datos administrativos')) updateBadge('✅ Propuesta Lista');

  return reply;
}

async function send(text) {
  if (waiting || !text.trim()) return;
  waiting = true;
  sendBtn.disabled = true;
  addMessage('user', text);
  showTyping();
  try {
    const reply = await callGroq(text);
    hideTyping();
    addMessage('bot', reply);
  } catch {
    hideTyping();
    addMessage('bot', 'Ocurrió un error de conexión. Por favor intenta de nuevo.');
  }
  waiting = false;
  sendBtn.disabled = false;
  userInput.focus();
}

async function init() {
  waiting = true;
  showTyping();
  try {
    const reply = await callGroq('Inicia la conversación. Preséntate brevemente como KaizenBot de ProKaizen Consulting, explica en una oración tu propósito y solicita el nombre del colaborador para comenzar.');
    hideTyping();
    addMessage('bot', reply);
    updateBadge('Fase 1: Datos');
  } catch {
    hideTyping();
    history = [];
    addMessage('bot', '¡Hola! Soy KaizenBot, el asistente de mejora continua de ProKaizen Consulting. Estoy aquí para ayudarte a construir una propuesta de mejora siguiendo la metodología Kaizen Teian.\n\n¿Cuál es tu nombre para comenzar?');
    updateBadge('Fase 1: Datos');
  }
  waiting = false;
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', () => {
  const t = userInput.value.trim();
  if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const t = userInput.value.trim();
    if (t) { userInput.value = ''; userInput.style.height = 'auto'; send(t); }
  }
});

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
});

init();
</script>
